<!DOCTYPE html>

<title>闯关数学乐园</title>
<style>
:root{
  /* 海洋岛屿色系（与计算乐园第二层「乘法小岛」统一） */
  --bg:#e9f5fc; --card:#ffffff; --line:#d9e9f3; --ink:#173a4d; --mut:#6b8399;
  --c1:#1B7FA8; --c2:#0f8a6d; --c3:#FF8A3D; --c4:#c07d12; --c5:#7f77dd;
  --ok:#1d9e75; --no:#e24b4a; --gold:#f2a90a; --soft:#e3f2fb;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(180deg,#8ED8F8 0%,#BDE9FF 18%,#e9f5fc 55%,#e9f5fc 100%);background-attachment:fixed;color:var(--ink);font-size:16px}
@keyframes islfloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
#app{max-width:900px;margin:0 auto;padding:12px 14px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 2px 12px}
.logo{font-size:20px;font-weight:700;letter-spacing:.5px}
.logo small{font-size:12px;color:var(--mut);font-weight:400;margin-left:6px}
.hd-right{display:flex;align-items:center;gap:8px}
.player-chips{display:flex;gap:6px}
.pchip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:5px 13px;font-size:14px;cursor:pointer;color:var(--mut)}
.pchip.on{background:var(--c1);border-color:var(--c1);color:#fff;font-weight:600}
.icon-btn{border:1.5px solid var(--line);background:var(--card);border-radius:10px;width:36px;height:36px;font-size:18px;cursor:pointer;line-height:1}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.nav-tab{border:0;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 4px;font-size:14px;cursor:pointer;color:var(--mut);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-tab.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
section.view{display:none}
section.view.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.muted{color:var(--mut)}
.h2{font-size:17px;font-weight:700;margin:0 0 4px}
.sub{font-size:13px;color:var(--mut);margin:0 0 14px}
.grid-hall{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.gcard{position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px 12px;cursor:pointer;text-align:center;transition:transform .12s}
.gcard:hover{transform:translateY(-3px)}
.gcard.locked{opacity:.55;cursor:not-allowed}
.gcard .ico{font-size:38px;line-height:1.2}
.gcard .nm{font-size:16px;font-weight:700;margin:6px 0 2px}
.gcard .ds{font-size:12px;color:var(--mut)}
.gcard .best{margin-top:8px;font-size:12px;color:#a87800;letter-spacing:1px}
.gcard .lock-tag{position:absolute;top:8px;right:8px;font-size:11px;background:#eef1f6;color:var(--mut);border-radius:999px;padding:2px 8px}
.gcard .lvl-row{display:flex;justify-content:center;gap:4px;margin-top:8px}
.lvl-dot{width:22px;height:22px;border-radius:7px;background:#eef1f6;color:#aab4c6;font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:700}
.lvl-dot.ok{background:#e8f6ef;color:var(--ok)}
.lvl-dot.full{background:#fdf0d5;color:#a87800}
.lvl-dot.free{cursor:pointer;transition:transform .1s,box-shadow .1s}
.lvl-dot.free:hover{transform:scale(1.15);box-shadow:0 0 0 2px color-mix(in srgb,var(--c1) 30%,transparent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:12px 22px;font-size:16px;font-weight:600;cursor:pointer;background:var(--c1);color:#fff;transition:transform .1s}
.btn:active{transform:scale(.96)}
.btn.big{font-size:18px;padding:14px 30px;width:100%}
.btn.ghost{background:var(--card);border:1.5px solid var(--line);color:var(--ink)}
.btn.orange{background:var(--c3)}
.btn.green{background:var(--c2)}
.btn.gold{background:var(--gold);color:#5c3d00}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row.center{justify-content:center}
.grow{flex:1}
.qbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;text-align:center;margin:10px 0}
.qtext{font-size:42px;font-weight:700;letter-spacing:2px;margin:6px 0;font-variant-numeric:tabular-nums}
.qstep{font-size:15px;color:var(--mut);margin-bottom:6px}
.tenrow{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:10px 0}
.dot{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:15px}
.dot.b{background:var(--c1)} .dot.o{background:var(--c3)} .dot.g{background:var(--ok)} .dot.y{background:var(--gold)}
.dot.ghost-dot{background:#edf0f6;color:#b6bfd0;border:2px dashed #cdd6e5}
.dot.carriage{display:inline-flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#dbeafe,#bfdbfe);border:2px solid #2563eb;border-radius:8px;color:#1e40af;padding:0 6px;min-width:38px;height:42px;box-sizing:border-box;position:relative;flex-shrink:0;gap:1px}
.dot.carriage .ic{font-size:18px;line-height:1}
.dot.carriage .badge{position:absolute;top:-5px;right:-6px;font-size:9px;background:#1e40af;color:#fff;padding:1px 3px;border-radius:6px;font-weight:700;line-height:1}
.dot.fruit{font-size:22px;line-height:1}
.dot.moved{background:#d4d8e1;color:#9aa3b5;opacity:.6;cursor:default}
.train-engine,.truck-engine{font-size:28px;width:42px;height:34px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;line-height:1;margin:0 2px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:280px;margin:10px auto}
.pad button{height:52px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;font-size:22px;font-weight:700;cursor:pointer}
.pad button:active{background:var(--soft)}
.pad button.pd-ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.pad button.pd-del{background:#fdeceb;color:var(--no);border-color:#f7d3d1}
.ansline{font-size:26px;font-weight:700;margin:6px 0;min-height:40px;font-variant-numeric:tabular-nums}
.opt-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:420px;margin:14px auto}
.opt{height:64px;border:2px solid var(--line);background:var(--card);border-radius:14px;font-size:26px;font-weight:700;cursor:pointer;color:var(--ink)}
.opt:active{transform:scale(.95)}
.opt.good{background:#e8f6ef;border-color:var(--ok);color:var(--ok)}
.opt.bad{background:#fdeceb;border-color:var(--no);color:var(--no)}
.progress{height:8px;background:#e8edf5;border-radius:99px;overflow:hidden;margin:8px 0}
.progress i{display:block;height:100%;background:var(--c1);border-radius:99px;transition:width .3s}
.timer{font-size:26px;font-weight:800;color:var(--c3);font-variant-numeric:tabular-nums}
.cal-box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:10px 0;font-size:34px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:3px}
.cal-box .ten{color:#b6bfd0}
.cal-box .borrow{color:var(--no);font-size:22px;position:relative}
.vert{display:flex;flex-direction:column;align-items:center;gap:4px}
.numrow{display:flex;gap:10px;justify-content:center;align-items:center}
.fillin{display:inline-flex;align-items:center;gap:6px;font-size:26px;font-weight:700}
.fillin input{width:70px;height:52px;border:2px solid var(--c1);border-radius:12px;text-align:center;font-size:26px;font-weight:700;color:var(--ink)}
.fillin input.c-blue{border-color:#2f6fd0;color:#2f6fd0;background:#eaf1fd}
.fillin input.c-green{border-color:#0f8a6d;color:#0f8a6d;background:#e8f6ef}
.fillin input.c-orange{border-color:#d85a30;color:#d85a30;background:#fcf0e8}
.fillin input.c-amber{border-color:#ba7517;color:#ba7517;background:#fbf3e2}
.fillin input.c-purple{border-color:#7f77dd;color:#7f77dd;background:#f0eefb}
.nc-blue{color:#2f6fd0}.nc-green{color:#0f8a6d}.nc-orange{color:#d85a30}.nc-amber{color:#ba7517}.nc-purple{color:#7f77dd}
.fillin input.ok{background:#e8f6ef;border-color:var(--ok);color:var(--ok)}
.fillin input.bad{background:#fdeceb;border-color:var(--no);color:var(--no)}
.hint-bar{background:#fdf6e3;border:1px solid #f2dd9b;border-radius:12px;padding:10px 14px;font-size:14px;color:#7a5b12;margin:8px 0}
.m-class-tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.m-tab{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;font-size:14px;cursor:pointer;color:var(--mut)}
.m-tab.on{background:var(--c1);color:#fff;border-color:var(--c1);font-weight:600}
.step-list{margin:10px 0;padding:0;list-style:none}
.step-list li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line);font-size:15px}
.step-list li .sn{flex:0 0 26px;height:26px;border-radius:8px;background:var(--soft);color:var(--c1);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:13px}
.step-list li.hl{background:#fbf4e2;border-radius:10px;padding:10px 8px;border-bottom-color:transparent}
.ach-grid{display:grid;grid-template-columns:110px repeat(6,1fr);gap:6px;font-size:13px}
.ach-grid .hd{font-weight:600;color:var(--mut);font-size:12px;align-self:center}
.ach-cell{border-radius:10px;padding:7px 3px;text-align:center;min-height:52px;display:flex;flex-direction:column;justify-content:center;background:#f1f4f9;color:#b6bfd0}
.ach-cell.on{background:var(--soft);color:var(--ink)}
.ach-cell .st{font-size:14px;color:#a87800;letter-spacing:1px}
.ach-cell .dt{font-size:11px;color:var(--mut);margin-top:2px}
.rank-tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.rtab{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:7px 13px;font-size:13px;cursor:pointer;color:var(--mut)}
.rtab.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
table.rank{width:100%;border-collapse:collapse;font-size:15px}
table.rank th{text-align:left;font-weight:600;color:var(--mut);font-size:13px;padding:8px 6px;border-bottom:1px solid var(--line)}
table.rank td{padding:9px 6px;border-bottom:1px dashed var(--line)}
.rk1{display:inline-flex;width:26px;height:26px;border-radius:50%;background:#fdf0d5;color:#a87800;font-weight:800;align-items:center;justify-content:center}
.rk2{display:inline-flex;width:26px;height:26px;border-radius:50%;background:#eef1f6;color:#7b89a3;font-weight:700;align-items:center;justify-content:center}
.stk-wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px;margin:12px 0}
.stk{width:100%;aspect-ratio:1;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--gold)}
.stk.empty{background:#f1f4f9;color:#cdd6e5;font-size:18px}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px dashed var(--line)}
/* ---- 家长报告 ---- */
.pp-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:10px;margin-top:12px}
.pp-cell{background:var(--soft);border-radius:12px;padding:10px 6px;text-align:center}
.pp-cell b{display:block;font-size:19px;font-weight:800;line-height:1.25;color:var(--ink)}
.pp-cell span{font-size:12px;color:var(--mut)}
.pp-game{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px;background:#fff}
.pp-lv{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;align-items:center}
.pp-lv div{font-size:12px;padding:4px 9px;border-radius:9px;background:#f1f4f9;color:var(--mut);font-weight:700}
.pp-lv div.on{background:#e6f7ef;color:#0f8a6d}
.pp-lv div.full{background:#fff4d6;color:#a87800}
.pp-tag{display:inline-block;font-size:12px;font-weight:800;padding:4px 11px;border-radius:999px}
.pp-good{background:#E9FBEF;color:#1D7A50}
.pp-mid{background:#FFF6DF;color:#9A6A00}
.pp-low{background:#FFECE4;color:#C2462A}
.pp-line{font-size:14px;line-height:1.9;margin:6px 0}
.set-row:last-child{border-bottom:0}
.switch{position:relative;width:52px;height:30px;background:#dfe5ef;border-radius:99px;cursor:pointer;transition:background .2s;flex:0 0 auto}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;background:#fff;border-radius:50%;transition:left .2s}
.switch.on{background:var(--ok)}
.switch.on::after{left:25px}
.modal-bg{position:fixed;inset:0;background:rgba(30,40,60,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal-bg.on{display:flex}
.modal{background:var(--card);border-radius:20px;padding:24px;max-width:400px;width:100%;text-align:center;animation:fade .25s}
.stars-big{font-size:40px;letter-spacing:6px;color:var(--gold);margin:6px 0}
.congrats{font-size:18px;font-weight:700;margin:4px 0}
.stat-line{font-size:14px;color:var(--mut);margin:4px 0}
.unlock-tip{background:#e8f6ef;border-radius:12px;padding:10px;margin:12px 0;font-size:14px;color:var(--ok);font-weight:600}
.badge-gold{display:inline-block;background:#fdf0d5;color:#a87800;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700}
.shop-shelf{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px;margin:10px 0}
.shop-item{border:1.5px solid var(--line);border-radius:14px;padding:10px;text-align:center;background:#fffdf6}
.shop-item .pico{display:flex;justify-content:center;flex-wrap:wrap;gap:2px;font-size:24px;min-height:34px}
.shop-item .pnm{font-size:13px;font-weight:600;margin:4px 0 2px}
.shop-item .ppr{font-size:14px;color:var(--c3);font-weight:700}
.receipt{background:#fffdf6;border:1px solid #f2e6c8;border-radius:14px;padding:12px 16px;margin:10px 0;font-size:15px}
.receipt .rline{display:flex;justify-content:space-between;padding:3px 0}
.receipt .rsep{border-top:1px dashed #e5d9b8;margin:6px 0}
/* 游戏5 综合关：格子货架 / 图形选项 / 钟面 / 纸币 / 规律 / 选购 */
.count-grid{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:330px;margin:8px auto;font-size:26px;line-height:1.3}
.count-grid span{width:32px;text-align:center}
.opt-row4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:440px;margin:14px auto}
.opt-icon{height:84px;border:2px solid var(--line);background:var(--card);border-radius:14px;font-size:36px;cursor:pointer;color:var(--ink);display:flex;align-items:center;justify-content:center}
.opt-icon:active{transform:scale(.95)}
.opt-icon.good{background:#e8f6ef;border-color:var(--ok)}
.opt-icon.bad{background:#fdeceb;border-color:var(--no)}
.pile-box{border:1.5px solid var(--line);border-radius:14px;padding:10px;background:#fffdf6;min-width:130px}
.pile-box .pile{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;font-size:22px;line-height:1.2;min-height:52px;align-items:center}
.pile-box .plabel{font-size:13px;color:var(--mut);margin-top:4px}
.shelf-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-width:320px;margin:10px auto}
.shelf-cell{border:1.5px dashed var(--line);border-radius:10px;height:54px;display:flex;align-items:center;justify-content:center;font-size:24px;background:#fffdf6;cursor:pointer}
.shelf-cell:active{background:var(--soft)}
.shelf-cell.picked{background:#e8f6ef;border-color:var(--ok);border-style:solid}
.shelf-cell.bad{background:#fdeceb;border-color:var(--no);border-style:solid;color:var(--no)}
.clock-face{width:132px;height:132px;margin:6px auto;display:block}
/* 店长记账账本 */
.ledger{display:flex;flex-direction:column;gap:10px;margin:8px 0}
.led-row{display:flex;gap:12px;align-items:center;background:#fbf9f2;border:1.5px solid var(--line);border-radius:14px;padding:10px}
.led-clock{width:96px;flex:none}
.led-clock .clock-face{width:100%;height:auto;margin:0}
.led-info{flex:1;text-align:left;min-width:0}
.day-note{background:#eef4ff;border:1px solid #c9dcff;color:#2b4a86;border-radius:10px;padding:7px 10px;font-size:13px;margin:2px 0 8px;text-align:left}
.stock-tbl{border:1px solid #dfe5ef;border-radius:12px;overflow:hidden;margin:6px 0 2px;font-size:15px}
.stock-tbl .str{display:grid;grid-template-columns:1.1fr 1fr 1fr 1.1fr;text-align:center;padding:7px 4px;border-bottom:1px solid #eef1f7}
.stock-tbl .str:last-child{border-bottom:0}
.stock-tbl .st-head{background:#f4f7fc;font-size:13px;color:var(--mut);font-weight:700}
.stock-tbl .in{color:var(--ok);font-weight:700}
.stock-tbl .out{color:#d9534f;font-weight:700}
.stock-tbl .money{color:#a87800;font-weight:700}
.led-desc{font-size:15px;font-weight:600;margin-bottom:8px}
.led-fields{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px;font-weight:700;color:var(--ink)}
.led-fwrap{display:inline-flex;align-items:center;gap:2px}
.led-f{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:34px;padding:0 6px;border:2px dashed #c3cbda;border-radius:9px;background:#fff;font-size:18px;font-weight:700;color:var(--ink)}
.led-f.on{border-style:solid;border-color:var(--c1);box-shadow:0 0 0 2px color-mix(in srgb,var(--c1) 25%,transparent)}
.led-f.ok{border:2px solid var(--ok);background:#e8f6ef;color:var(--ok)}
.led-f.bad{border-color:var(--no);background:#fdeeee}
.bill{display:inline-block;border:1.5px solid #b9c6d8;border-radius:8px;padding:9px 13px;margin:4px;background:#eef4fb;font-weight:700;font-size:19px;color:#2f6fd0}
/* 仿真人民币：1元硬币 + 5/10/20/50/100 纸币（按真实主色调） */
.rm-money{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center}
.rm-note{position:relative;display:inline-flex;align-items:center;justify-content:center;width:98px;height:46px;border-radius:6px;margin:4px;box-shadow:0 1px 3px rgba(0,0,0,.18);font-weight:800;color:#fff;border:1px solid rgba(0,0,0,.15);overflow:hidden}
.rm-note .rm-den{font-size:26px;text-shadow:0 1px 1px rgba(0,0,0,.25);margin-left:18px}
.rm-note .rm-txt{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:8px;letter-spacing:3px;opacity:.8;font-weight:600}
.rm-note .rm-wm{position:absolute;left:7px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;font-size:13px;background:rgba(255,255,255,.14);opacity:.85}
.rm-note.n5{background:linear-gradient(135deg,#9a6ab8,#6d4391)}
.rm-note.n10{background:linear-gradient(135deg,#4a7ab0,#274f80)}
.rm-note.n20{background:linear-gradient(135deg,#b07c40,#7e5222)}
.rm-note.n50{background:linear-gradient(135deg,#4a9a6c,#1f6b42)}

function mergeCloud(p,cloud){
  var local=PROFILES[p]||{records:[],stickers:{},created:Date.now()};

function g5Stars(ok,total){if(R&&R.g===5&&R.l>=6){return Math.min(3,Math.max(0,ok));}return starsOf(ok,total);}
function isL6Round(){return !!(R&&R.g===5&&R.l>=6);}

function gameOpen(g){if(S.freeMode)return true;if(g===1)return true;if(g===5)return true;/* 超市小掌柜是综合应用关，开局即可玩 */for(var i=0;i<GLEV[g-1];i++){if(anyPlayerQualified(g-1,i))return true;}return false;}
function levelOpen(g,l){if(S.freeMode)return true;if(!gameOpen(g))return false;if(l===0)return true;if(g===5)return (l%2===0)?true:anyPlayerQualified(5,l-1);/* 角色内逐级解锁：每个角色的第1级直接开放 */return anyPlayerQualified(g,l-1);}
function bestFrom(rs,g,l,p){var f=[];for(var i=0;i<rs.length;i++){var r=rs[i];if(!r)continue;if(r.g===g&&r.l===l&&r.p===p)f.push(r);}if(!f.length)return null;
  return f.reduce(function(b,r){if(r.stars>b.stars||(r.stars===b.stars&&(r.correct/r.total)>(b.correct/b.total))||(r.stars===b.stars&&(r.correct/r.total)===(b.correct/b.total)&&r.seconds<b.seconds))return r;return b;},f[0]);}

function gameTotalStars(g){var sum=0;for(var i=0;i<GLEV[g];i++){var b=bestFor(g,i,CUR);if(b)sum+=b.stars;}return sum;}

function renderRankBody(body,players,err){

  rows.sort(function(x,y){if(y.b.stars!==x.b.stars)return y.b.stars-x.b.stars;var xr=x.b.correct/x.b.total,yr=y.b.correct/y.b.total;if(yr!==xr)return yr-xr;return x.b.seconds-y.b.seconds;});
  var myRank=0,myBest=null;for(var k=0;k<rows.length;k++){if(rows[k].p===CUR){myRank=k+1;myBest=rows[k].b;break;}}

  if(myRank===0){html2+='<tr><td colspan="5" style="background:#fafafa;color:var(--mut);font-size:13px;padding:10px;text-align:center">你在该难度还没有成绩，<a style="color:var(--c2);cursor:pointer" onclick="go(\'hall\')">去挑战一局</a> 即可上榜</td></tr>';}
  body.innerHTML=html2;

function rankPlayersLocal(){var names=[];for(var k in PROFILES){if(k!==ADMIN_USER)names.push({username:k,records:PROFILES[k].records||[]});}return names;}
function bestFromCloud(rs,g,l,p){if(!rs||!rs.length)return null;var f=[];for(var i=0;i<rs.length;i++){var r=rs[i];if(r.g===g&&r.l===l&&r.p===p)f.push(r);}if(!f.length)return null;
  return f.reduce(function(b,r){if(r.stars>b.stars||(r.stars===b.stars&&(r.correct/r.total)>(b.correct/b.total))||(r.stars===b.stars&&(r.correct/r.total)===(b.correct/b.total)&&r.seconds<b.seconds))return r;return b;},f[0]);}

  var html='<div class="card"><p class="h2">⭐ 贴纸墙 · '+CUR+'</p><p class="sub">每达标一局（≥1 星）得 1 颗星，攒满 10 颗庆祝一次</p>';
  html+='<div style="display:flex;align-items:center;gap:14px;margin:6px 0 4px"><div style="font-size:44px;font-weight:800">'+n+"</div><div style=\"font-size:14px;color:var(--mut)\">颗星星<br>距离下个 10 颗还差 "+(10-n%10)+" 颗</div></div>";
  html+='<div class="stk-wall">';for(var i=0;i<40;i++){html+=i<n?'<div class="stk">⭐</div>':'<div class="stk empty">·</div>';}
  html+="</div><div class=\"row center\"><button class=\"btn ghost\" onclick=\"printSticker()\">🖨️ 打印贴纸墙</button></div></div>";
  el.innerHTML=html;}
function printSticker(){var box=document.getElementById("stkPrint");
  box.style.display="block";box.innerHTML='<div style="font-family:sans-serif;padding:20px"><h2 style="margin:0 0 12px">⭐ 贴纸墙 · '+CUR+'（'+stickersOf(CUR)+' 颗）</h2><div style="display:grid;grid-template-columns:repeat(8,44px);gap:8px">';
  var n=stickersOf(CUR);for(var i=0;i<40;i++){box.innerHTML+=i<n?'<div style="width:44px;height:44px;border-radius:12px;background:#fdf0d5;display:flex;align-items:center;justify-content:center;font-size:22px">⭐</div>':'<div style="width:44px;height:44px;border-radius:12px;background:#f1f4f9"></div>';}
  box.innerHTML+="</div></div>";window.print();setTimeout(function(){box.style.display="none";box.innerHTML="";},500);}

/* ============ 家长报告 ============ */
var G5_ROLES=[{n:"理货员",ic:"📦",ls:[0,1]},{n:"收银员",ic:"💰",ls:[2,3]},{n:"店长",ic:"⏰",ls:[4,5]},{n:"顾客",ic:"🛍️",ls:[6,7]}];
function gIcon(g){var x=GAMES[g-1];return x?x.icon:"🎮";}
function gName(g){var x=GAMES[g-1];return x?x.name:("游戏"+g);}
function pctTxt(a,b){return (b?Math.round(a/b*100):0)+"%";}
function secTxt(s){if(!s)return "—";return s<60?(s+" 秒"):(Math.floor(s/60)+" 分"+(s%60)+" 秒");}
function dayTxt(ts){var d=new Date(ts||0);return (d.getMonth()+1)+"月"+d.getDate()+"日";}
/* 游戏5 的 L7/L8（下标 6/7）是「3 轮采购」，分数是达标轮数不是题数 */
function isRoundLv(g,l){return g===5&&l>=6;}
function parentRecs(){
  var rs=(PROFILES[CUR]&&PROFILES[CUR].records)||[],out=[],i;
  for(i=0;i<rs.length;i++){var r=rs[i];if(!r)continue;if(r.p&&r.p!==CUR)continue;if(!r.g||!r.total)continue;out.push(r);}
  return out;
}
function parentDays(recs){var seen={},n=0,i;
  for(i=0;i<recs.length;i++){var d=new Date(recs[i].ts||0);var k=d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();if(!seen[k]){seen[k]=1;n++;}}
  return n;}
/* 一档（游戏 × 难度）的统计 */
function statOf(recs,g,l){
  var f=[],i;
  for(i=0;i<recs.length;i++){if(recs[i].g===g&&recs[i].l===l)f.push(recs[i]);}
  if(!f.length)return null;
  var ok=0,tt=0,sec=0,best=0,last=0;
  for(i=0;i<f.length;i++){ok+=f[i].correct||0;tt+=f[i].total||0;sec+=f[i].seconds||0;
    if((f[i].stars||0)>best)best=f[i].stars||0;if((f[i].ts||0)>last)last=f[i].ts||0;}
  return {n:f.length,ok:ok,total:tt,acc:tt?ok/tt:0,sec:sec,best:best,last:last,spt:tt?sec/tt:0};
}
function gameStat(g,recs){
  var st={g:g,n:0,ok:0,total:0,sec:0,star:0,lv:[],rn:0,rok:0,rtotal:0},i;
  for(i=0;i<GLEV[g];i++){var s=statOf(recs,g,i);st.lv.push(s);
    if(s){st.n+=s.n;st.sec+=s.sec;st.star+=s.best;
      if(isRoundLv(g,i)){st.rn+=s.n;st.rok+=s.ok;st.rtotal+=s.total;}   /* 采购轮次单独算，不混进题目正确率 */
      else{st.ok+=s.ok;st.total+=s.total;}}}
  st.acc=st.total?st.ok/st.total:0;st.spt=st.total?st.sec/st.total:0;
  return st;
}
/* 该档「最好的一次」（星级高优先，再看正确率，再看快） */
function bestRecOf(recs,g,l){
  var f=[],i;
  for(i=0;i<recs.length;i++){var r=recs[i];if(r&&r.g===g&&r.l===l)f.push(r);}
  if(!f.length)return null;
  return f.reduce(function(b,r){
    var br=(b.total?b.correct/b.total:0),rr=(r.total?r.correct/r.total:0);
    if((r.stars||0)!==(b.stars||0))return (r.stars||0)>(b.stars||0)?r:b;
    if(rr!==br)return rr>br?r:b;
    return ((r.seconds||9999)<(b.seconds||9999))?r:b;},f[0]);
}
function accWord(a){return a>=0.95?"扎实":a>=0.85?"比较稳":a>=0.7?"还有提升空间":"需要多练";}
function accShort(a){return a>=0.95?"很稳":a>=0.85?"稳":a>=0.7?"要练":"加油";}
function accCls(a){return a>=0.9?"pp-good":a>=0.7?"pp-mid":"pp-low";}
function ppCell(v,t){return '<div class="pp-cell"><b>'+v+"</b><span>"+t+"</span></div>";}
/* 一档的小徽章 */
function parentLvChip(g,l,recs){
  var s=statOf(recs,g,l),b=bestRecOf(recs,g,l);
  if(!s||!b)return "<div>"+LEVELS[l]+" 未玩</div>";
  var cls=s.best>=3?"full":"on";
  var txt=isRoundLv(g,l)?("达标 "+b.correct+"/"+b.total+" 轮"):(b.correct+"/"+b.total);
  return '<div class="'+cls+'" title="'+lvlDesc(g,l)+" · 最佳 "+s.best+" 星 · 玩了 "+s.n+" 局 · 累计正确率 "+
    pctTxt(s.ok,s.total)+'">'+LEVELS[l]+" "+("★".repeat(s.best)+"☆".repeat(3-s.best))+" "+txt+"</div>";
}
/* 单个游戏卡 */
function parentGameHTML(g,recs){
  var G=GAMES[g-1],st=gameStat(g,recs);
  var h='<div class="pp-game" style="border-left:5px solid '+G.color+'">';
  h+='<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">';
  h+='<div style="font-size:26px">'+G.icon+"</div>";
  h+='<div style="flex:1;min-width:150px"><div style="font-weight:800;font-size:15px">'+G.name+
     ' <span class="muted" style="font-weight:600;font-size:12px">· '+GNAME[g]+"</span></div>";
  h+='<div class="muted" style="font-size:12px;margin-top:2px">'+G.desc+"</div></div>";
  h+=st.n?('<span class="pp-tag '+accCls(st.acc)+'">'+accShort(st.acc)+" "+pctTxt(st.ok,st.total)+"</span>")
        :'<span class="pp-tag" style="background:#f1f4f9;color:#8d99a8">还没玩过</span>';
  h+="</div>";
  if(st.n){
    var line="练了 <b>"+st.n+"</b> 局";
    if(st.total)line+=" · 答对 "+st.ok+" / "+st.total+" · 平均 "+st.spt.toFixed(1)+" 秒/题";
    if(st.rn)line+=" · 🛍️ 采购任务达标 "+st.rok+" / "+st.rtotal+" 轮";
    line+=" · 累计 "+st.star+" 星";
    h+='<div class="muted" style="font-size:13px;margin-top:8px">'+line+"</div>";
  }else{
    h+='<div class="muted" style="font-size:13px;margin-top:8px">一局都还没玩，先去大厅挑战 '+LEVELS[0]+" 吧</div>";
  }
  h+='<div class="pp-lv">';
  if(g===5){
    for(var r=0;r<G5_ROLES.length;r++){var ro=G5_ROLES[r];
      h+='<div style="background:none;padding:0 2px 0 0;color:var(--mut)">'+ro.ic+" "+ro.n+"</div>";
      for(var t=0;t<ro.ls.length;t++)h+=parentLvChip(g,ro.ls[t],recs);}
  }else{
    for(var l=0;l<GLEV[g];l++)h+=parentLvChip(g,l,recs);}
  h+="</div></div>";
  return h;
}
/* 👍 哪里做得好 */
function parentGood(recs){
  var out=[],g,l,i,three=[];
  for(g=1;g<=5;g++)for(l=0;l<GLEV[g];l++){var s=statOf(recs,g,l);if(s&&s.best>=3)three.push({g:g,l:l,s:s,b:bestRecOf(recs,g,l)});}
  three.sort(function(a,b){return b.s.acc-a.s.acc||a.s.spt-b.s.spt;});
  for(i=0;i<Math.min(2,three.length);i++){var t=three[i];
    out.push(gIcon(t.g)+" <b>"+gName(t.g)+" "+LEVELS[t.l]+"</b>（"+lvlDesc(t.g,t.l)+"）：拿到 <b>3 星</b>，"+
      (isRoundLv(t.g,t.l)?("采购任务 "+t.b.correct+"/"+t.b.total+" 轮全部达标"):("正确率 "+pctTxt(t.s.ok,t.s.total)+"，平均 "+t.s.spt.toFixed(1)+" 秒/题")));}
  var best=null;
  for(g=1;g<=5;g++){var st=gameStat(g,recs);if(st.n>=2&&(!best||st.acc>best.acc))best=st;}
  if(best&&best.acc>=0.85)out.push("正确率最高的是 "+gIcon(best.g)+" <b>"+gName(best.g)+"</b>：练了 "+best.n+" 局，"+
    "答对 "+best.ok+" / "+best.total+"（"+pctTxt(best.ok,best.total)+"）");
  var days=parentDays(recs);
  if(days>=3)out.push("已经坚持练习 <b>"+days+"</b> 天，习惯正在养成 👍");
  if(stickersOf(CUR)>=10)out.push("贴纸星攒到 <b>"+stickersOf(CUR)+"</b> 颗（每达标一局得 1 颗）");
  return out;
}
/* 💪 哪里还要练 */
function parentTodo(recs){
  var out=[],g,l,i,weak=[],never=[],slow=[];
  for(g=1;g<=5;g++){
    for(l=0;l<GLEV[g];l++){
      var s=statOf(recs,g,l);
      if(s){if(s.best<3)weak.push({g:g,l:l,s:s});}
      else if(levelOpen(g,l))never.push({g:g,l:l});
    }
    if(g<=4){var st=gameStat(g,recs);if(st.n>=1&&st.spt>7)slow.push({g:g,st:st});}
  }
  weak.sort(function(a,b){return a.s.acc-b.s.acc;});
  /* 已经在「正确率不够」里点过名的游戏，不再重复说它慢 */
  var named={};for(i=0;i<Math.min(2,weak.length);i++)named[weak[i].g]=1;
  slow=slow.filter(function(x){return !named[x.g];});
  for(i=0;i<Math.min(2,weak.length);i++){var w=weak[i],why,b2=bestRecOf(recs,w.g,w.l);
    if(isRoundLv(w.g,w.l))why=w.s.best===0?"采购任务一轮都没达标":"还差 "+(b2.total-b2.correct)+" 轮就能拿 3 星（3 轮全达标）";
    else why=w.s.best===0?"还没拿到 1 星（正确率要到 70%）":w.s.best===1?"现在是 1 星，85% 才有 2 星":"现在是 2 星，全对才有 3 星";
    out.push(gIcon(w.g)+" <b>"+gName(w.g)+" "+LEVELS[w.l]+"</b>（"+lvlDesc(w.g,w.l)+"）：玩了 "+w.s.n+" 局，"+
      (isRoundLv(w.g,w.l)?("采购任务最好 "+b2.correct+"/"+b2.total+" 轮达标"):("正确率 "+pctTxt(w.s.ok,w.s.total)))+" —— "+why+"。");}
  for(i=0;i<Math.min(1,slow.length);i++){var sl=slow[i];
    var tip=sl.g===4?"每天固定练一局，先把每道题算稳，再回头比 30 秒速度":("每天加一局 ⚡ 口算闪电战（30 秒限时）练速度");
    out.push(gIcon(sl.g)+" <b>"+gName(sl.g)+"</b> 平均 "+sl.st.spt.toFixed(1)+" 秒/题，比其它项目慢 —— "+tip+"。");}
  if(never.length){var x=never[0];
    out.push(gIcon(x.g)+" <b>"+gName(x.g)+" "+LEVELS[x.l]+"</b>（"+lvlDesc(x.g,x.l)+"）已经解锁但<b>还没玩过</b>，可以先试一局。");}
  for(g=2;g<=5;g++){if(!gameOpen(g)&&gameStat(g,recs).n===0){
    out.push(gIcon(g)+" <b>"+gName(g)+"</b> 还没解锁：在 "+gIcon(g-1)+" "+gName(g-1)+" 拿到 1 星（或玩满 3 次）就能打开。");break;}}
  return out;
}
/* 📌 下一步怎么做 */
function parentPlan(recs){
  var out=[],g,l,weak=null;
  for(g=1;g<=5;g++)for(l=0;l<GLEV[g];l++){var s=statOf(recs,g,l);if(s&&s.best<3&&(!weak||s.acc<weak.s.acc))weak={g:g,l:l,s:s};}
  if(weak)out.push("本周重点练 "+gIcon(weak.g)+" <b>"+gName(weak.g)+" "+LEVELS[weak.l]+"</b>：每天 1 局（约 3 分钟），先把正确率提到 85%。");
  else out.push("玩过的项目都拿到 3 星了 🎉 可以挑战更高的难度档，或去 🛒 超市小掌柜练实际应用。");
  out.push("每天固定 10 分钟、到点就停；孩子算错时先问「你是怎么算的」，别直接给答案。");
  out.push("想提速 → ⚡ 口算闪电战（30 秒限时）；想练应用 → 🛒 超市小掌柜（认钱、看钟、记账、采购）。");
  return out;
}
function parentRecentHTML(recs){
  var f=recs.slice().sort(function(a,b){return (b.ts||0)-(a.ts||0);}).slice(0,8),i;
  var h='<table class="rank"><thead><tr><th style="width:64px">日期</th><th>项目</th><th style="text-align:center">星</th>'+
    '<th style="text-align:right">成绩</th><th style="text-align:right">用时</th></tr></thead><tbody>';
  for(i=0;i<f.length;i++){var r=f[i];
    h+='<tr><td>'+dayTxt(r.ts)+'</td><td>'+gIcon(r.g)+" "+gName(r.g)+" "+LEVELS[r.l]+'</td>'+
      '<td style="text-align:center;color:#a87800">'+("★".repeat(r.stars||0)+"☆".repeat(3-(r.stars||0)))+"</td>"+
      '<td style="text-align:right">'+(isRoundLv(r.g,r.l)?("达标 "+r.correct+"/"+r.total+" 轮"):(r.correct+"/"+r.total))+"</td>"+
      '<td style="text-align:right" class="muted">'+secTxt(r.seconds)+"</td></tr>";}
  return h+"</tbody></table>";
}
function parentHTML(){
  var recs=parentRecs(),i,g;
  var tot=0,ok=0,secs=0,star=0,last=0;
  for(i=0;i<recs.length;i++){ok+=recs[i].correct||0;tot+=recs[i].total||0;secs+=recs[i].seconds||0;if((recs[i].ts||0)>last)last=recs[i].ts||0;}
  for(g=1;g<=5;g++)star+=gameStat(g,recs).star;
  var acc=tot?ok/tot:0,spt=tot?secs/tot:0,days=parentDays(recs);
  var h="";
  h+='<div class="card"><p class="h2">🧑‍🏫 家长报告 · '+CUR+"</p>";
  h+='<p class="sub">按「游戏 × 难度档」统计孩子的练习表现（本机 + 云端合并），下面还有「哪里做得好 / 哪里还要练」</p>';
  if(!recs.length){
    h+='<div class="pp-line">这个账号<b>还没有任何对局记录</b> —— 让孩子先去大厅玩一局，这里会自动生成报告。</div>';
    h+="</div>";
    return h;
  }
  h+='<div class="pp-sum">'+ppCell(recs.length+"","对局")+ppCell(ok+"/"+tot,"答对 / 总题")+
     ppCell(pctTxt(ok,tot),"正确率")+ppCell(spt.toFixed(1)+" 秒","平均每题")+
     ppCell(star+"","累计星")+ppCell(stickersOf(CUR)+"","贴纸")+ppCell(days+"","练习天数")+"</div>";
  h+='<div class="pp-line" style="margin-top:12px"><b>总评：</b>一共练了 <b>'+recs.length+"</b> 局（"+tot+" 题），正确率 <b>"+
     pctTxt(ok,tot)+"</b>，平均每题 "+spt.toFixed(1)+" 秒 —— 整体<b>"+accWord(acc)+"</b>；最近一次练习是 "+dayTxt(last)+"。";
  if(spt>7)h+=" 算得出来但偏慢，可以每天加一局 30 秒限时练习。";
  h+="</div></div>";
  var good=parentGood(recs),todo=parentTodo(recs),plan=parentPlan(recs);
  h+='<div class="card" style="margin-top:12px;border-top:4px solid var(--ok)"><p class="h2">🌟 哪里做得好</p>';
  if(!good.length)h+='<div class="pp-line muted">还没有拿到 3 星的项目 —— 先陪孩子把最简单的一档练到全对，成就感上来就快了。</div>';
  for(i=0;i<good.length;i++)h+='<div class="pp-line">👍 '+good[i]+"</div>";
  h+="</div>";
  h+='<div class="card" style="margin-top:12px;border-top:4px solid var(--c3)"><p class="h2">💪 哪里还要练</p>';
  if(!todo.length)h+='<div class="pp-line muted">暂时没有明显弱项 —— 保持每天 10 分钟就好 👏</div>';
  for(i=0;i<todo.length;i++)h+='<div class="pp-line">📍 '+todo[i]+"</div>";
  h+="</div>";
  h+='<div class="card" style="margin-top:12px"><p class="h2">📌 接下来怎么做</p>';
  for(i=0;i<plan.length;i++)h+='<div class="pp-line">'+(i+1)+". "+plan[i]+"</div>";
  h+="</div>";
  h+='<div class="card" style="margin-top:12px"><p class="h2">🎮 每个游戏的表现</p><p class="sub">★ 是该档拿到的最佳星级 · 百分比是累计正确率</p>';
  for(g=1;g<=5;g++)h+=parentGameHTML(g,recs);
  h+="</div>";
  h+='<div class="card" style="margin-top:12px"><p class="h2">🕒 最近 8 局</p>'+parentRecentHTML(recs)+"</div>";
  return h;
}
function renderParent(){
  var el=document.getElementById("view-parent");if(!el)return;
  if(!CUR){el.innerHTML='<div class="card"><p class="h2">🧑‍🏫 家长报告</p><p class="sub">登录后才能看到这个账号的练习报告</p></div>';return;}
  el.innerHTML='<div class="card"><p class="h2">🧑‍🏫 家长报告 · '+CUR+'</p><p class="sub">⏳ 正在整理成绩（本机 + 云端）…</p></div>';
  var draw=function(){
    var box=document.getElementById("view-parent");
    if(!box||box.className.indexOf("on")<0)return;   /* 已经切到别的页面就别再重绘了 */
    box.innerHTML=parentHTML();
  };
  draw();
  if(tcbReady())tcbFetch(CUR,function(c){
    if(!c)return;
    PROFILES[CUR]=mergeCloud(CUR,c);saveProfiles();draw();
  });
}

/* ============ 设置 ============ */
function renderSettings(){var el=document.getElementById("view-settings");
  var html='<div class="card"><p class="h2">设置</p>';
  html+='<div class="set-row"><div><b>当前账号</b><div class="muted" style="font-size:13px">成绩与解锁记录保存在此账号下</div></div><div class="row" style="gap:6px"><span class="pchip on">👤 '+CUR+'</span><button class="btn ghost" style="padding:6px 14px;font-size:13px" onclick="logout()">退出登录</button></div></div>';
  html+='<div class="set-row"><div><b>自由模式</b><div class="muted" style="font-size:13px">打开后所有游戏和难度全部解锁</div></div><div class="switch'+(S.freeMode?" on":"")+'" onclick="toggleFree()"></div></div>';
  html+='<div class="set-row"><div><b>每局题量</b><div class="muted" style="font-size:13px">挑战时长约 3–5 分钟</div></div><div class="row" style="gap:6px" id="qtyRow"></div></div>';
  html+='<div class="set-row"><div><b>数据管理</b><div class="muted" style="font-size:13px">当前账号的排行榜与成就存在本机浏览器</div></div><div class="row" style="gap:6px"><button class="btn ghost" style="padding:8px 14px;font-size:13px" onclick="exportData()">导出</button><button class="btn ghost" style="padding:8px 14px;font-size:13px;color:var(--no);border-color:#f2c4c0" onclick="clearData()">清空</button></div></div>';

function makeOpts1(ans){
  var set={};set[ans]=1;var tries=0;
  while(Object.keys(set).length<3&&tries<50){tries++;var d=ri(1,Math.max(2,Math.min(5,ans+1)));var v=ans+d;if(Math.random()<0.5)v=ans-d;if(v>=0&&v!==ans)set[v]=1;}
  var arr=Object.keys(set).map(Number);while(arr.length<3){var last=arr[arr.length-1]||ans;var next=last+1;while(set[next])next++;arr.push(next);}
  for(var i=arr.length-1;i>0;i--){var j=ri(0,i);var z=arr[i];arr[i]=arr[j];arr[j]=z;}
  return arr.slice(0,3);}

      html+='<div class="str"><span>第 '+d4.day+' 天</span><span class="in">+'+d4.inN+' 件</span><span class="out">-'+d4.outN+' 件</span><span class="money">¥'+d4.earn+"</span></div>";}
    html+="</div>";
    html+='<div style="font-size:13px;color:var(--mut);margin:6px 0">进货合起来减去卖出合起来＝店里还剩的库存；三天的收钱加起来＝一共赚的钱</div>';
    html+='<div class="ledger" id="ledgerBook"><div class="led-row"><div class="led-info"><div class="led-fields">';
    for(var j4=0;j4<q.fields.length;j4++){html+='<span class="led-fwrap">'+q.fields[j4].pre+'<span class="led-f" data-r="0" data-f="'+j4+'">·</span>'+q.fields[j4].suf+"</span>";}
    html+="</div></div></div></div>";
    html+='<div id="ledFb"></div>';
    html+='<div class="pad" id="shopPad"></div>';}
  else if(q.kind==="budget"){
    var need=Math.ceil(q.budget*0.6);
    html+='<div class="buy-grid" id="buyGrid">'+q.goods.map(function(g,i){return '<div class="buy-item" data-i="'+i+'"><div class="bico">'+g.icon+'</div><div class="bnm">'+g.name+'</div><div class="bpr">¥'+g.price+'</div><div class="blim">限购'+(g.cap||3)+'件</div><div class="bqty" data-q="'+i+'"></div></div>';}).join("")+"</div>";
    html+='<div class="budget-bar"><div class="rline"><span>💰 预算</span><b>¥'+q.budget+"</b></div>";
    html+='<div class="rline"><span>🛒 已选 <span id="cntT" style="font-weight:700">0</span> 件</span><span style="font-size:12px;color:var(--mut)">花了多少、还剩多少，自己算一算</span></div>';
    html+='<div class="rsep"></div>';
    if(q.mission){html+='<div style="font-size:13px;color:#a87800;font-weight:700">📋 任务：'+q.mission.txt+"（记得别超支）</div></div>";}
    else{html+='<div style="font-size:13px;color:var(--mut)">目标：不超支，并尽量花掉 ≥ ¥'+need+"（越多越划算）</div></div>";}
    html+='<div id="buyTip"></div>';
    html+='<div class="row center" style="gap:10px;margin-top:6px"><button type="button" class="btn ghost" id="buyReset">↺ 重新选</button><button type="button" class="btn orange" id="buyOk">🛒 结账</button></div>';}
  else{
    var shelf="";
    html+='<div class="shop-shelf" id="shelf5">';
    for(var i2=0;i2<q.items.length;i2++){var it=q.items[i2];var icons=(it.qty&&it.qty>1)?repeatStr5(it.icon,it.qty):it.icon;var qtyText=(it.qty&&it.qty>1)?" ×"+it.qty:"";
      shelf+='<div class="shop-item"><div class="pico">'+icons+'</div><div class="pnm">'+it.name+qtyText+'</div><div class="ppr">¥'+it.price+"</div></div>";}
    html+=shelf+"</div>";
    html+='<div class="receipt"><div class="rline"><span>🛒 顾客买了</span></div>';
    for(var j=0;j<q.items.length;j++){var it2=q.items[j];var qtyText2=(it2.qty&&it2.qty>1)?" ×"+it2.qty:"";
      html+='<div class="rline"><span>'+it2.icon+" "+it2.name+qtyText2+'</span><span>¥'+it2.price+"</span></div>";}
    html+='<div class="rsep"></div>';
    if(q.mode==="change"){
      html+='<div class="rline"><span>顾客付了</span><span style="font-weight:700">¥'+q.pay+"</span></div></div>";
      html+='<div class="ansline">要找零 ¥<span id="rmSum" style="color:var(--c2)">0</span></div>';
      html+='<div class="rm-tray" id="rmTray"><span class="empty">从下面点钱，放进钱箱</span></div>';
      html+='<div class="rm-palette" id="rmPal">'+(q.dens||[1,5,10]).map(function(d){return '<button type="button" class="rm-pick" data-d="'+d+'" title="'+d+'元">'+moneyHTML5(d)+"</button>";}).join("")+"</div>";
      html+='<div class="row center" style="gap:8px;margin:4px 0"><button type="button" class="btn ghost" id="rmUndo">↩ 撤销一张</button><button type="button" class="btn ghost" id="rmClear">🗑 清空</button><button type="button" class="btn orange" id="rmOk">✅ 找零完成</button></div>';
      html+='<div style="font-size:13px;color:var(--mut)">先点大面额，再点硬币凑零头，凑够要找的钱</div>';}
    else{
      html+='<div class="rline"><span>顾客付了</span><span style="font-weight:700">¥'+q.pay+"</span></div></div>";
      html+='<div class="ansline">一共要付 ¥<span id="inpA"></span></div>';
      html+='<div class="pad" id="shopPad"></div>';}}
  html+="</div>";
  return html;}
function g5RightMsg(q){if(q.kind==="count"){return q.ans+" 个，数得真准！";}
  if(q.kind==="compare"){return "多 "+q.ans+" 个，比得对！";}
  if(q.kind==="money"){return "一共 ¥"+q.ans+"，认得真快！";}
  if(q.kind==="clock"){return "是 "+q.ans+" 点"+(q.half?"半":"")+"，看对了！";}
  if(q.kind==="ledger"){return "账本记得又对又清楚，真是个好店长！";}
  if(q.kind==="stock"){return "还剩 "+(q.totIn-q.totOut)+" 件库存，一共赚了 ¥"+q.totEarn+"，总账算得真清楚！";}
  if(q.kind==="pattern"){return "规律找对了，下一个应该摆它！";}
  if(q.kind==="stat"){return q.ans+" 个，统计正确！";}
  return q.mode==="sum"?"算得又快又准！":"找零正确！";}
function g5Wrong(q){var el=document.getElementById("gameBody");
  el.innerHTML=noLine("正确答案是 "+q.ans)+'<div style="text-align:center;padding:10px">再来一次…</div>';advance(false);}
function bindNum5(q){var val5="";
  var pad=document.getElementById("shopPad");if(!pad)return;
  pad.innerHTML=["1","2","3","4","5","6","7","8","9","0","⌫","确定"].map(function(k){return '<button type="button" data-k="'+k+'">'+k+"</button>";}).join("");
  pad.addEventListener("click",function(ev){var k=ev.target.getAttribute("data-k");if(!k)return;
    var disp=document.getElementById("inpA");
    if(k==="⌫"){val5=val5.slice(0,-1);}
    else if(k==="确定"){if(val5==="")return;var v=parseInt(val5,10);
      if(v===q.ans){answerOk(g5RightMsg(q));}
      else{g5Wrong(q);}return;}
    else{val5=(val5+k).slice(0,3);}
    if(disp){disp.textContent=val5||"·";}});}
function bindPick5(q){var box=document.getElementById("pickBox");if(!box)return;
  box.addEventListener("click",function(ev){
    var btn=ev.target.closest?ev.target.closest("[data-i]"):null;if(!btn)return;
    var i=parseInt(btn.getAttribute("data-i"),10);
    if(i===q.ans){btn.className+=" good";answerOk(g5RightMsg(q)||"选对啦！");}
    else{btn.className+=" bad";g5Wrong(q);}});}
function bindPlace5(q){var grid=document.getElementById("shelfGrid");if(!grid)return;
  grid.addEventListener("click",function(ev){
    var cell=ev.target.closest?ev.target.closest(".shelf-cell"):null;if(!cell)return;
    var i=parseInt(cell.getAttribute("data-i"),10);
    if(i===q.ans){cell.className+=" picked";cell.textContent=q.icon;answerOk("摆对啦！第 "+q.row+" 层第 "+q.col+" 格");}
    else{cell.className+=" bad";cell.textContent="✗";g5Wrong(q);}});}
var R6Cart=null;
function bindBudget5(q){R6Cart=[];
  function upd(){var spent=0,cnt={};
    for(var i=0;i<R6Cart.length;i++){cnt[R6Cart[i]]=(cnt[R6Cart[i]]||0)+1;spent+=q.goods[R6Cart[i]].price;}
    for(var j=0;j<q.goods.length;j++){
      var capJ=q.goods[j].cap||99;
      var qt=document.querySelector('.bqty[data-q="'+j+'"]');if(qt){qt.textContent=cnt[j]?"已选 ×"+cnt[j]+"（限购"+capJ+"）":"";}
      var it=document.querySelector('.buy-item[data-i="'+j+'"]');if(it){if(cnt[j]){it.className="buy-item sel";}else{it.className="buy-item";}}}
    var ct=document.getElementById("cntT");
    if(ct){ct.textContent=R6Cart.length;}
    return spent;}
  var grid=document.getElementById("buyGrid");
  if(grid){grid.addEventListener("click",function(ev){
    var it=ev.target.closest?ev.target.closest(".buy-item"):null;if(!it)return;
    var gi=parseInt(it.getAttribute("data-i"),10),g=q.goods[gi];
    var cnt2={};for(var c2=0;c2<R6Cart.length;c2++){cnt2[R6Cart[c2]]=(cnt2[R6Cart[c2]]||0)+1;}
    var cap=g.cap||99;
    if((cnt2[gi]||0)>=cap){var tip0=document.getElementById("buyTip");
      if(tip0){tip0.innerHTML='<div style="text-align:center;font-size:14px;color:var(--no);margin:4px">🚫 「'+g.name+'」限购 '+cap+' 件，换别的一样试试</div>';}
      return;}
    R6Cart.push(gi);upd();
    var tip=document.getElementById("buyTip");if(tip){tip.innerHTML="";}});}
  var rst=document.getElementById("buyReset");
  if(rst){rst.addEventListener("click",function(){R6Cart=[];upd();var tip=document.getElementById("buyTip");if(tip){tip.innerHTML="";}});}
  var okb=document.getElementById("buyOk");
  if(okb){okb.addEventListener("click",function(){
    var spent=upd(),need=Math.ceil(q.budget*0.6),tip=document.getElementById("buyTip");
    if(spent>q.budget){if(tip){tip.innerHTML='<div class="hint-bar" style="margin-top:8px">钱不够啦（超出 ¥'+(spent-q.budget)+"），去掉一样再试试～</div>";}return;}
    if(spent===0){if(tip){tip.innerHTML='<div class="hint-bar" style="margin-top:8px">还没选东西呢，先挑几样吧～</div>';}return;}
    if(q.mission){var pass2=true,msg2="";
      if(q.mission.type==="minN"&&R6Cart.length<q.mission.n){pass2=false;msg2="任务：至少买 "+q.mission.n+" 件，现在才 "+R6Cart.length+" 件，再挑一点吧～";}
      if(q.mission.type==="maxN"&&R6Cart.length>q.mission.n){pass2=false;msg2="任务：最多买 "+q.mission.n+" 件，现在选了 "+R6Cart.length+" 件，去掉一些吧～";}
      if(q.mission.type==="share"){var cnt3={};for(var c3=0;c3<R6Cart.length;c3++){cnt3[R6Cart[c3]]=(cnt3[R6Cart[c3]]||0)+1;}
        var has=false;for(var kk in cnt3){if(cnt3[kk]>=q.mission.n&&cnt3[kk]%q.mission.n===0)has=true;}
        if(!has){pass2=false;msg2="任务：要有一种商品买到 "+q.mission.n+" 的倍数个（比如 "+q.mission.n+" 个、"+(q.mission.n*2)+" 个），才能平均分给 "+q.mission.n+" 个小伙伴哦～";}}
      if(!pass2){if(tip){tip.innerHTML='<div class="hint-bar" style="margin-top:8px">'+msg2+"</div>";}return;}
      answerOk("任务完成！花了 ¥"+spent+"，还剩 ¥"+(q.budget-spent)+"，规划得真棒！");return;}
    if(spent>=need){answerOk("花了 ¥"+spent+"，还剩 ¥"+(q.budget-spent)+"，规划得真棒！");}
    else{answerNo("没超支，但只花了 ¥"+spent+"（预算 ¥"+q.budget+"），还能再多买点～");}});}
  upd();}
function bindChange5(q){var cart=[];
  function upd(){var s=0;for(var i=0;i<cart.length;i++)s+=cart[i];
    var sum=document.getElementById("rmSum");if(sum)sum.textContent=String(s);
    var tr=document.getElementById("rmTray");
    if(tr){tr.innerHTML=cart.length?cart.map(function(d){return moneyHTML5(d);}).join(""):'<span class="empty">从下面点钱，放进钱箱</span>';}
    return s;}
  var pal=document.getElementById("rmPal");
  if(pal){pal.addEventListener("click",function(ev){
    var b=ev.target.closest?ev.target.closest(".rm-pick"):null;if(!b)return;
    cart.push(parseInt(b.getAttribute("data-d"),10));upd();});}
  var un=document.getElementById("rmUndo");
  if(un){un.addEventListener("click",function(){cart.pop();upd();});}
  var cl=document.getElementById("rmClear");
  if(cl){cl.addEventListener("click",function(){cart=[];upd();});}
  var okb=document.getElementById("rmOk");
  if(okb){okb.addEventListener("click",function(){
    if(!cart.length)return;
    var s=0;for(var i=0;i<cart.length;i++)s+=cart[i];
    if(s===q.ans){answerOk("找零正确！你点出 ¥"+s+"，找得很准！");}
    else{g5Wrong(q);}});}}
/* 通用填格交互：所有空格填完后统一按「确定」检查——对的锁绿，错的标红清空，改完再点确定，全对过关 */
function bindFieldsFill(rows,q){var ri2=0,fi=0,done=0,totalF=0;for(var a=0;a<rows.length;a++)totalF+=rows[a].length;
  function firstOpen(){for(var r=0;r<rows.length;r++)for(var f=0;f<rows[r].length;f++){if(!rows[r][f].ok){ri2=r;fi=f;return;}}}
  firstOpen();
  var fb=document.getElementById("ledFb");
  function say(msg){if(fb)fb.innerHTML='<div class="hint-bar" style="margin-top:8px">'+msg+"</div>";}
  function paint(){var els=document.querySelectorAll(".led-f");
    for(var e=0;e<els.length;e++){var r=parseInt(els[e].getAttribute("data-r"),10),f=parseInt(els[e].getAttribute("data-f"),10);
      var st=rows[r]&&rows[r][f];if(!st)continue;
      els[e].className="led-f"+(st.ok?" ok":(st.bad?" bad":(r===ri2&&f===fi?" on":"")));
      els[e].textContent=st.v||"·";}}
  paint();
  var book=document.getElementById("ledgerBook");
  if(book){book.addEventListener("click",function(ev){
    var t=ev.target.closest?ev.target.closest(".led-f"):null;if(!t)return;
    var r=parseInt(t.getAttribute("data-r"),10),f=parseInt(t.getAttribute("data-f"),10);
    if(!rows[r]||!rows[r][f]||rows[r][f].ok)return;ri2=r;fi=f;paint();});}
  var pad=document.getElementById("shopPad");if(!pad)return;
  pad.innerHTML=["1","2","3","4","5","6","7","8","9","0","⌫","确定"].map(function(k){return '<button type="button" data-k="'+k+'">'+k+"</button>";}).join("");
  pad.addEventListener("click",function(ev){var k=ev.target.getAttribute("data-k");if(!k)return;
    var cur=rows[ri2][fi];
    if(cur.ok){firstOpen();cur=rows[ri2][fi];}
    if(k==="⌫"){cur.v=cur.v.slice(0,-1);cur.bad=false;paint();return;}
    if(k==="确定"){var empt=0,wrong=0;
      for(var r=0;r<rows.length;r++)for(var f=0;f<rows[r].length;f++){var st=rows[r][f];
        if(st.ok)continue;
        if(st.v===""){empt++;continue;}
        if(parseInt(st.v,10)===st.ans){st.ok=true;st.bad=false;done++;}
        else{st.bad=true;wrong++;st.v="";}}
      if(done>=totalF){paint();say("");answerOk(g5RightMsg(q));return;}
      firstOpen();
      if(wrong>0)say("有 "+wrong+" 个格子不对（已标红擦掉），改一改再点「确定」");
      else if(empt>0)say("还有 "+empt+" 个空格没填，填完再点「确定」哦");
      paint();return;}
    cur.v=(cur.v+k).slice(0,3);cur.bad=false;paint();});}
function bindLedger5(q){var rows=[];
  for(var i=0;i<q.rows.length;i++){var fs=ledFields(q.rows[i]);
    rows.push(fs.map(function(f){return {ans:f.ans,v:"",ok:false,bad:false};}));}
  bindFieldsFill(rows,q);}
/* 总账题：只有两个空格（剩余库存 / 赚钱总数），交互与账本一致 */
function bindStock5(q){bindFieldsFill([q.fields.map(function(f){return {ans:f.ans,v:"",ok:false,bad:false};})],q);}
function bindGame5(q){
  if(q.kind==="budget"){bindBudget5(q);return;}
  if(q.kind==="ledger"){bindLedger5(q);return;}
  if(q.kind==="stock"){bindStock5(q);return;}
  if(q.kind==="shape"||q.kind==="odd"||q.kind==="pattern"){bindPick5(q);return;}
  if(q.kind==="place"){bindPlace5(q);return;}
  if(q.kind==="num"&&q.mode==="change"){bindChange5(q);return;}
  bindNum5(q);}

/* ============ 结算 ============ */
function finishRound(){if(R.flashTimer)clearInterval(R.flashTimer);var secs=Math.max(1,Math.round((Date.now()-R.start)/1000));
  var groups={};for(var i=0;i<R.qs.length;i++){var a=R.ans[i];if(!a)continue;if(!groups[a.p])groups[a.p]={ok:0,total:0};groups[a.p].total++;if(a.ok)groups[a.p].ok++;}
  var list=[];for(var p in groups){list.push({p:p,ok:groups[p].ok,total:groups[p].total});}
  if(!list.length)list=[{p:CUR,ok:R.answers,total:R.qs.length}];
  for(var k=0;k<list.length;k++){var st=g5Stars(list[k].ok,list[k].total);
    profileRec(list[k].p).push({g:R.g,l:R.l,p:list[k].p,correct:list[k].ok,total:list[k].total,seconds:secs,stars:st,ts:Date.now()});
    if(st>=1)addSticker(list[k].p);}
  save();saveProfiles();
  var before=[];for(var g2=2;g2<=5;g2++){if(!gameOpen(g2))before.push(g2);}
  var unlocks=[];for(var m=0;m<before.length;m++){if(gameOpen(before[m]))unlocks.push(before[m]);}
  showResult(list,secs,unlocks);}
function finishRoundExtra(correct,secs){if(R.flashTimer)clearInterval(R.flashTimer);var list=[{p:CUR,ok:correct,total:Math.max(correct,10)}];
  var st=starsOf(correct,Math.max(correct,10));
  profileRec(list[0].p).push({g:R.g,l:R.l,p:list[0].p,correct:correct,total:Math.max(correct,10),seconds:secs,stars:st,ts:Date.now()});
  if(st>=1)addSticker(list[0].p);save();saveProfiles();
  var before=[];for(var g2=2;g2<=5;g2++){if(!gameOpen(g2))before.push(g2);}
  var unlocks=[];for(var m=0;m<before.length;m++){if(gameOpen(before[m]))unlocks.push(before[m]);}
  showResult(list,secs,unlocks);}
function showResult(list,secs,unlocks){var g=GAMES[R.g-1];var first=list[0];
  var st=g5Stars(first.ok,first.total);
  var html='<div class="congrats">'+(st>=3?"太厉害了！":st>=2?"很不错！":st>=1?"达标啦！":"继续加油！")+"</div>";
  html+='<div class="stars-big">'+("★".repeat(st)+"☆".repeat(3-st))+"</div>";
  html+='<div class="stat-line">'+g.icon+" "+g.name+" · "+LEVELS[R.l]+" · "+first.p+"</div>";
  html+='<div class="stat-line">'+(isL6Round()?(R.l===7?("3 轮任务采购里有 "+first.ok+" 轮达标（不超支 + 完成任务）"):("3 轮采购里有 "+first.ok+" 轮规划达标（不超支且花得值）")):("答对 "+first.ok+" / "+first.total+" 题"))+" · 用时 "+(secs<60?secs+" 秒":Math.floor(secs/60)+" 分"+(secs%60))+"</div>";
  if(st>=1)html+='<div class="stat-line">⭐ 获得 1 颗贴纸星（累计 '+stickersOf(first.p)+" 颗）</div>";
  if(unlocks.length){html+='<div class="unlock-tip">🎉 新游戏解锁：'+unlocks.map(function(u){return GAMES[u-1].icon+GAMES[u-1].name;}).join("、")+"！去大厅试试吧</div>";}
  html+='<div class="row center" style="margin-top:16px"><button class="btn ghost grow" onclick="closeModal();go(\'hall\')">回大厅</button><button class="btn orange grow" onclick="again()">再来一局</button></div>';
  openModal(html);}
function again(){closeModal();var g=R.g,l=R.l;startRound(g,l);}
function openModal(html){var bg=document.getElementById("modalBg");document.getElementById("modalBox").innerHTML=html;bg.className="modal-bg on";}
function maybeClassTip(){
  if(!CUR||!PROFILES[CUR])return;
  var P=PROFILES[CUR];
  if(P.classSeen||P.classTip)return;
  P.classTip=1;saveProfiles();
  var mb=document.getElementById("modalBox");
  mb.innerHTML='<div style="text-align:center"><div style="font-size:42px;margin:8px 0">📚</div><p style="font-size:16px;font-weight:600;margin:4px 0 6px;line-height:1.7">这个账号还没有看过「四法课堂」哦！</p><p style="font-size:14px;color:var(--mut);margin:0 0 18px;line-height:1.7">建议先学习方法，再去大厅游戏里练习，会玩得更顺利～</p><div class="row center" style="gap:10px"><button class="btn ghost" style="flex:1" onclick="closeModal()">继续逛大厅</button><button class="btn" style="flex:1" onclick="closeModal();go(\'class\')">去四法课堂</button></div></div>';
  document.getElementById("modalBg").className="modal-bg on";}
function closeModal(){document.getElementById("modalBg").className="modal-bg";}
function askConfirm(msg,act){
  var mb=document.getElementById("modalBox");
  mb.innerHTML='<div style="text-align:center"><p style="font-size:16px;font-weight:600;margin:4px 0 18px;line-height:1.6">'+msg+'</p><div class="row center" style="gap:10px"><button class="btn ghost" style="flex:1" onclick="closeModal()">取消</button><button class="btn" style="flex:1;background:var(--no);border-color:var(--no)" onclick="'+act+';closeModal()">确定</button></div></div>';
  document.getElementById("modalBg").className="modal-bg on";}
function quitRound(){askConfirm("退出本局？本局成绩不记录。","quitRoundNow()");}
function quitRoundNow(){if(R&&R.flashTimer)clearInterval(R.flashTimer);R=null;go("hall");}

/* ============ 初始化 ============ */
function initAuth(){var sess=null;try{sess=localStorage.getItem(SESS_KEY);}catch(e){}
  if(sess&&PROFILES[sess]){CUR=sess;renderUserChip();go("hall");}
  else{showLogin();}}
tcbBoot();
initAuth();
