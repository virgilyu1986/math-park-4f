<style>

html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:16px}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}

.grid-hall{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}

.gcard:hover{transform:translateY(-3px)}

.gcard .ico{font-size:38px;line-height:1.2}

.btn.ghost{background:var(--card);border:1.5px solid var(--line);color:var(--ink)}
.btn.orange{background:var(--c3)}
.btn.green{background:var(--c2)}
.btn.gold{background:var(--gold);color:#5c3d00}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row.center{justify-content:center}
.grow{flex:1}
.qbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;text-align:center;margin:10px 0}
.qtext{font-size:42px;font-weight:700;letter-spacing:2px;margin:6px 0;font-variant-numeric:tabular-nums}
.qstep{font-size:15px;color:var(--mut);margin-bottom:6px}
.tenrow{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:10px 0}

.dot.b{background:var(--c1)} .dot.o{background:var(--c3)} .dot.g{background:var(--ok)} .dot.y{background:var(--gold)}

.dot.carriage .ic{font-size:18px;line-height:1}

.dot.fruit{font-size:22px;line-height:1}
.dot.moved{background:#d4d8e1;color:#9aa3b5;opacity:.6;cursor:default}

.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:280px;margin:10px auto}

function mergeCloud(p,cloud){
  var local=PROFILES[p]||{records:[],stickers:{},created:Date.now()};
  var seen={},all=[];var lr=local.records||[],cr=cloud.records||[];
  for(var i=0;i<lr.length;i++){var k1=JSON.stringify(lr[i]);if(!seen[k1]){seen[k1]=1;all.push(lr[i]);}}
  for(var j=0;j<cr.length;j++){var k2=JSON.stringify(cr[j]);if(!seen[k2]){seen[k2]=1;all.push(cr[j]);}}
  var created=Math.min(local.created||Date.now(),cloud.created||Date.now());
  var merged={records:all,stickers:{},created:created,classSeen:Math.max(local.classSeen||0,cloud.classSeen||0),classTip:Math.max(local.classTip||0,cloud.classTip||0)};
  var cnt=0;for(var m=0;m<all.length;m++){if(all[m].p===p&&all[m].stars>=1)cnt++;}
  merged.stickers[p]=cnt;
  return merged;}

function starsOf(correct,total){if(!total)return 0;var r=correct/total;if(r>=1)return 3;if(r>=0.85)return 2;if(r>=0.7)return 1;return 0;}
function recsOf(g,l){var rs=curRec();var f=[];for(var i=0;i<rs.length;i++){if(rs[i].g===g&&rs[i].l===l)f.push(rs[i]);}return f;}
function anyPlayerQualified(g,l){var rs=recsOf(g,l);return rs.some(function(r){return r.stars>=1;})||rs.length>=3;}
function gameOpen(g){if(S.freeMode)return true;if(g===1)return true;for(var i=0;i<GLEV[g-1];i++){if(anyPlayerQualified(g-1,i))return true;}return false;}

function bestFrom(rs,g,l,p){var f=[];for(var i=0;i<rs.length;i++){var r=rs[i];if(r.g===g&&r.l===l&&r.p===p)f.push(r);}if(!f.length)return null;
  return f.reduce(function(b,r){if(r.stars>b.stars||(r.stars===b.stars&&(r.correct/r.total)>(b.correct/b.total))||(r.stars===b.stars&&(r.correct/r.total)===(b.correct/b.total)&&r.seconds<b.seconds))return r;return b;},f[0]);}
function bestFor(g,l,p){return PROFILES[p]?bestFrom(PROFILES[p].records,g,l,p):null;}

/* ============ 题目生成器（严格匹配难度） ============ */
function ri(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function genAdd(l){if(l>2)l=2;var a,b,t1,t2,base,add2,carry,rest,ans,t;
  if(l===0){t1=0;t2=0;a=ri(2,9);b=ri(2,9);while(a+b<=10){a=ri(2,9);b=ri(2,9);}base=a;add2=b;t=a+" + "+b;}
  else if(l===1){t2=0;t1=ri(1,4);a=ri(2,9);b=ri(2,9);while(a+b<=10){b=ri(2,9);}base=t1*10+a;add2=b;t=(t1*10+a)+" + "+b;}
  else{t1=ri(1,4);a=ri(2,9);t2=ri(1,4);b=ri(2,9);while(a+b<=10){b=ri(2,9);}base=t1*10+a;add2=t2*10+b;t=(t1*10+a)+" + "+(t2*10+b);}
  carry=10-a;rest=add2-carry;ans=base+add2;
  var fruit=FRUITS[ri(0,FRUITS.length-1)];var fruits=[];for(var k=0;k<10+add2;k++)fruits.push(fruit);
  return {t:t,ans:ans,carry:carry,rest:rest,n1:a,n2:b,t1:t1,t2:t2,fruits:fruits,fruit:fruit};}
function genSub1(l){if(l>2)l=2;var t,u,d,t1,u1,t2,u2;
  if(l===0){t=1;u=ri(1,8);d=ri(u+1,9);return {t:(t*10+u)+" - "+d,ans:t*10+u-d,sub:d-u};}
  if(l===1){t=ri(2,4);u=ri(1,8);d=ri(u+1,9);return {t:(t*10+u)+" - "+d,ans:t*10+u-d,sub:d-u};}
  t1=ri(2,8);u1=ri(1,8);t2=ri(1,t1-1);u2=ri(u1+1,9);
  return {t:(t1*10+u1)+" - "+(t2*10+u2),ans:t1*10+u1-t2*10-u2,sub:u2-u1};}
function genSub2(l){if(l>2)l=2;var t1,u1,t2,u2,d;
  if(l===0){t1=ri(2,6);u1=ri(0,8);d=ri(u1+1,9);return {t:(t1*10+u1)+" - "+d,ans:t1*10+u1-d};}
  if(l===1){t1=ri(3,7);u1=ri(0,8);t2=ri(1,t1-1);u2=ri(u1+1,9);return {t:(t1*10+u1)+" - "+(t2*10+u2),ans:t1*10+u1-t2*10-u2};}
  t1=ri(3,7);u1=ri(0,8);t2=ri(1,t1-1);u2=ri(u1+1,9);
  var A=t1*10+u1,B=t2*10+u2;
  var mid=A-B;
  var c;
  if(Math.random()<0.5 && mid>=10)c=ri(1,Math.floor(mid/10))*10;
  else c=ri(1,mid%10);
  return {t:A+" - "+B+" - "+c,ans:mid-c,mid:mid,c:c};}
function genMix(l){var a,b,t,t1,t2,c,op;
  if(l===0){a=ri(2,9);b=ri(2,9);op=Math.random()<0.5?"+":"-";if(op==="-"&&a<b){var z=a;a=b;b=z;}return {t:a+" "+op+" "+b,ans:op==="+"?a+b:a-b};}
  if(l===1){t=ri(1,4);a=ri(2,9);b=ri(2,9);op=Math.random()<0.5?"+":"-";if(op==="-"){if(a<b){var z=a;a=b;b=z;}return {t:(t*10+a)+" "+op+" "+b,ans:t*10+a-b};}return {t:(t*10+a)+" + "+b,ans:t*10+a+b};}
  if(l===2){t1=ri(1,4);a=ri(2,9);t2=ri(1,4);b=ri(2,9);op=Math.random()<0.5?"+":"-";if(op==="-"){if(t1*10+a<t2*10+b){var sw=t1;t1=t2;t2=sw;var w=a;a=b;b=w;}}return {t:(t1*10+a)+" "+op+" "+(t2*10+b),ans:op==="+"?t1*10+a+t2*10+b:t1*10+a-t2*10-b};}
  a=ri(2,9);b=ri(2,9);op=Math.random()<0.5?"+":"-";c=ri(1,9);var m=op==="+"?a+b:a-b;if(m<0){var z=a;a=b;b=z;m=a-b;}if(m<2){op="+";m=a+b;}var op2=Math.random()<0.5?"+":"-";var ans=op2==="+"?m+c:m-c;while(ans<0){c=ri(1,9);ans=m-c;}
  return {t:a+" "+op+" "+b+" "+op2+" "+c,ans:ans};}
function genShop(l){
  if(l===3){
    /* L4：单价个位数买几件（乘法），可能混买一件两位数单价商品，付 50 元以上找零 */
    var q=ri(3,9),p=ri(2,9);
    var idx=ri(0,GOODS.length-1);
    var items=[{name:GOODS[idx][0],icon:GOODS[idx][1],price:p,qty:q}];
    if(Math.random()<0.6){
      var idx2=ri(0,GOODS.length-1);while(idx2===idx){idx2=ri(0,GOODS.length-1);}
      var p2max=Math.min(48,98-p*q);
      if(p2max>=11){items.push({name:GOODS[idx2][0],icon:GOODS[idx2][1],price:ri(11,p2max),qty:1});}
    }
    var total=0;for(var i=0;i<items.length;i++){total+=items[i].price*items[i].qty;}
    var pay=(total+1<=50)?50:100;
    return {t:"",items:items,total:total,mode:"change",pay:pay,change:pay-total,ans:pay-total};}
  var priceFn,count=2;
  if(l===0)priceFn=function(){return ri(1,9);};
  else if(l===1)priceFn=function(){return ri(3,19);};
  else priceFn=function(){return ri(8,45);};
  var items2=[];var used=[];
  for(var j=0;j<count;j++){var idx3=ri(0,GOODS.length-1);while(used.indexOf(idx3)>=0){idx3=ri(0,GOODS.length-1);}used.push(idx3);items2.push({name:GOODS[idx3][0],icon:GOODS[idx3][1],price:priceFn(),qty:1});}
  var total2=items2[0].price+items2[1].price;
  var mode=(l===2&&Math.random()<0.4)?"change":"sum";
  var pay2=0,change2=0;
  if(mode==="change"){var faces=[20,50,100];for(var k=0;k<faces.length;k++){if(faces[k]>=total2+1){pay2=faces[k];break;}}if(!pay2){pay2=100;total2=Math.min(total2,99);}change2=pay2-total2;}
  return {t:"",items:items2,total:total2,mode:mode,pay:pay2,change:change2,ans:mode==="sum"?total2:change2};}
function genQ(g,l){if(g===1)return genAdd(l);if(g===2)return genSub1(l);if(g===3)return genSub2(l);if(g===4)return genMix(l);return genShop(l);}
function hintText(g,q){if(g===1)return "凑十法：先看 "+q.n1+" 差 "+(10-q.n1)+" 凑成 10，再从 "+q.n2+" 里拿走 "+(10-q.n1)+"，剩 "+(q.n2-(10-q.n1))+"，10 + "+(q.n2-(10-q.n1))+" = "+q.ans;

  if(g===3)return "借十法：个位不够减，向十位借 1 个十，个位变成十几再减";
  if(g===4)return "先算个位，再算十位，注意进位和退位";
  return "算对总价/找零，顾客就会满意地点头";}

function game1Hint(q,l){

  if(l===0)return"💡 用凑十法：先点 "+c+" 个橙点补满十格，再看 10 + "+r+" = "+ans;
  if(l===1){var t1=Math.floor(a/10);return"💡 用凑十法："+a+" + "+c+" = "+(t1+1)*10+"，再看 "+(t1+1)*10+" + "+r+" = "+ans;}

  for(var i=0;i<10;i++){
    if(i<n1){row1+='<span class="dot b fruit">'+fruit+'</span>';}
    else{row1+='<span class="dot ghost-dot" data-slot="'+(i-n1)+'">·</span>';}
  }

  html+=shelf+"</div>";
  html+='<div class="receipt"><div class="rline"><span>🛒 顾客买了</span></div>';
  for(var j=0;j<q.items.length;j++){var it2=q.items[j];var qtyText2=(it2.qty&&it2.qty>1)?" "+it2.qty+"个":"";html+='<div class="rline"><span>'+it2.icon+" "+it2.name+qtyText2+'</span><span>¥'+it2.price+'/个</span></div>';}
  html+='<div class="rsep"></div>';
  if(q.mode==="change"){html+='<div class="rline"><span>顾客付了</span><span style="font-weight:700">¥'+q.pay+"</span></div>";}
  html+="</div>";
  html+='<div class="ansline">'+(q.mode==="sum"?"总价是 ¥<span id=\"inpA\"></span>":"要找零 ¥<span id=\"inpA\"></span>")+"</div>";
  html+='<div class="pad" id="shopPad"></div></div>';
  return html;}
function bindGame5(q){var val5="";
  var pad=document.getElementById("shopPad");
  pad.innerHTML=["1","2","3","4","5","6","7","8","9","0","⌫","确定"].map(function(k){return '<button type="button" data-k="'+k+'">'+k+"</button>";}).join("");
  pad.addEventListener("click",function(ev){var k=ev.target.getAttribute("data-k");if(!k)return;
    var disp=document.getElementById("inpA");
    if(k==="⌫"){val5=val5.slice(0,-1);}
    else if(k==="确定"){if(val5==="")return;var v=parseInt(val5,10);
      if(v===q.ans){answerOk(q.mode==="sum"?"算得又快又准！":"找零正确！");}
      else{var el=document.getElementById("gameBody");el.innerHTML=noLine(q.mode==="sum"?"总价是 "+q.ans+" 元":"应该找 "+q.ans+" 元")+"<div style=\"text-align:center;padding:10px\">再来一次…</div>";advance(false);}return;}
    else{val5=(val5+k).slice(0,3);}
    if(disp)disp.textContent=val5||"·";});}

/* ============ 结算 ============ */
function finishRound(){if(R.flashTimer)clearInterval(R.flashTimer);var secs=Math.max(1,Math.round((Date.now()-R.start)/1000));
  var groups={};for(var i=0;i<R.qs.length;i++){var a=R.ans[i];if(!a)continue;if(!groups[a.p])groups[a.p]={ok:0,total:0};groups[a.p].total++;if(a.ok)groups[a.p].ok++;}
  var list=[];for(var p in groups){list.push({p:p,ok:groups[p].ok,total:groups[p].total});}
  if(!list.length)list=[{p:CUR,ok:R.answers,total:R.qs.length}];
  for(var k=0;k<list.length;k++){var st=starsOf(list[k].ok,list[k].total);
    profileRec(list[k].p).push({g:R.g,l:R.l,p:list[k].p,correct:list[k].ok,total:list[k].total,seconds:secs,stars:st,ts:Date.now()});
    if(st>=1)addSticker(list[k].p);}
  save();saveProfiles();
  var before=[];for(var g2=2;g2<=5;g2++){if(!gameOpen(g2))before.push(g2);}
  var unlocks=[];for(var m=0;m<before.length;m++){if(gameOpen(before[m]))unlocks.push(before[m]);}
  showResult(list,secs,unlocks);}
function finishRoundExtra(correct,secs){if(R.flashTimer)clearInterval(R.flashTimer);var list=[{p:CUR,ok:correct,total:Math.max(correct,10)}];
  var st=starsOf(correct,Math.max(correct,10));
  profileRec(list[0].p).push({g:R.g,l:R.l,p:list[0].p,correct:correct,total:Math.max(correct,10),seconds:secs,stars:st,ts:Date.now()});
  if(st>=1)addSticker(list[0].p);save();saveProfiles();
  var before=[];for(var g2=2;g2<=5;g2++){if(!gameOpen(g2))before.push(g2);}
  var unlocks=[];for(var m=0;m<before.length;m++){if(gameOpen(before[m]))unlocks.push(before[m]);}
  showResult(list,secs,unlocks);}
function showResult(list,secs,unlocks){var g=GAMES[R.g-1];var first=list[0];
  var st=starsOf(first.ok,first.total);
  var html='<div class="congrats">'+(st>=3?"太厉害了！":st>=2?"很不错！":st>=1?"达标啦！":"继续加油！")+"</div>";
  html+='<div class="stars-big">'+("★".repeat(st)+"☆".repeat(3-st))+"</div>";
  html+='<div class="stat-line">'+g.icon+" "+g.name+" · "+LEVELS[R.l]+" · "+first.p+"</div>";
  html+='<div class="stat-line">答对 '+first.ok+" / "+first.total+" 题 · 用时 "+(secs<60?secs+" 秒":Math.floor(secs/60)+" 分"+(secs%60))+"</div>";
  if(st>=1)html+='<div class="stat-line">⭐ 获得 1 颗贴纸星（累计 '+stickersOf(first.p)+" 颗）</div>";
  if(unlocks.length){html+='<div class="unlock-tip">🎉 新游戏解锁：'+unlocks.map(function(u){return GAMES[u-1].icon+GAMES[u-1].name;}).join("、")+"！去大厅试试吧</div>";}
  html+='<div class="row center" style="margin-top:16px"><button class="btn ghost grow" onclick="closeModal();go(\'hall\')">回大厅</button><button class="btn orange grow" onclick="again()">再来一局</button></div>';
  openModal(html);}
function again(){closeModal();var g=R.g,l=R.l;startRound(g,l);}
function openModal(html){var bg=document.getElementById("modalBg");document.getElementById("modalBox").innerHTML=html;bg.className="modal-bg on";}
function maybeClassTip(){
  if(!CUR||!PROFILES[CUR])return;
  var P=PROFILES[CUR];
  if(P.classSeen||P.classTip)return;
  P.classTip=1;saveProfiles();
  var mb=document.getElementById("modalBox");
  mb.innerHTML='<div style="text-align:center"><div style="font-size:42px;margin:8px 0">📚</div><p style="font-size:16px;font-weight:600;margin:4px 0 6px;line-height:1.7">这个账号还没有看过「四法课堂」哦！</p><p style="font-size:14px;color:var(--mut);margin:0 0 18px;line-height:1.7">建议先学习方法，再去大厅游戏里练习，会玩得更顺利～</p><div class="row center" style="gap:10px"><button class="btn ghost" style="flex:1" onclick="closeModal()">继续逛大厅</button><button class="btn" style="flex:1" onclick="closeModal();go(\'class\')">去四法课堂</button></div></div>';
  document.getElementById("modalBg").className="modal-bg on";}
function closeModal(){document.getElementById("modalBg").className="modal-bg";}
function askConfirm(msg,act){
  var mb=document.getElementById("modalBox");
  mb.innerHTML='<div style="text-align:center"><p style="font-size:16px;font-weight:600;margin:4px 0 18px;line-height:1.6">'+msg+'</p><div class="row center" style="gap:10px"><button class="btn ghost" style="flex:1" onclick="closeModal()">取消</button><button class="btn" style="flex:1;background:var(--no);border-color:var(--no)" onclick="'+act+';closeModal()">确定</button></div></div>';
  document.getElementById("modalBg").className="modal-bg on";}
function quitRound(){askConfirm("退出本局？本局成绩不记录。","quitRoundNow()");}
function quitRoundNow(){if(R&&R.flashTimer)clearInterval(R.flashTimer);R=null;go("hall");}

/* ============ 初始化 ============ */
function initAuth(){var sess=null;try{sess=localStorage.getItem(SESS_KEY);}catch(e){}
  if(sess&&PROFILES[sess]){CUR=sess;renderUserChip();go("hall");}
  else{showLogin();}}
tcbBoot();
initAuth();
</script>
