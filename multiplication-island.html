<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>乘法小岛 · 计算乐园第二层</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;font-family:"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden;}
  body{
    background:linear-gradient(180deg,#8ED8F8 0%,#BDE9FF 35%,#5BC8E8 70%,#2E9FCB 100%);
    display:flex;align-items:center;justify-content:center;
    -webkit-user-select:none;user-select:none;
  }
  #app{width:min(96vw,760px);height:min(96vh,940px);display:flex;flex-direction:column;align-items:center;position:relative;}

  /* ---------- 通用 ---------- */
  .gameTitle{font-size:clamp(34px,8.5vw,60px);font-weight:900;color:#fff;
    text-shadow:0 4px 0 #1B7FA8,0 8px 18px rgba(0,60,90,.35);letter-spacing:4px;}
  .gameSub{margin-top:10px;font-size:clamp(14px,3.6vw,20px);color:#0E5E7E;font-weight:700;
    background:rgba(255,255,255,.75);padding:8px 22px;border-radius:999px;display:inline-block;}
  .bigBtn{font-size:clamp(20px,5vw,28px);font-weight:900;color:#fff;
    background:linear-gradient(180deg,#FFB63D,#FF8A3D);border:none;cursor:pointer;
    padding:16px 48px;border-radius:999px;box-shadow:0 6px 0 #D96A1B,0 12px 24px rgba(0,0,0,.2);
    transition:transform .1s;}
  .bigBtn:active{transform:translateY(5px);box-shadow:0 1px 0 #D96A1B;}
  .ghostBtn{font-size:15px;font-weight:800;color:#0E5E7E;background:rgba(255,255,255,.85);
    border:none;padding:9px 20px;border-radius:999px;cursor:pointer;box-shadow:0 3px 0 #B8D8E8;}
  .ghostBtn:active{transform:translateY(3px);box-shadow:0 0 0 #B8D8E8;}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
  @keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  @keyframes rise{0%{transform:translateY(30px);opacity:0}100%{transform:translateY(0);opacity:1}}
  @keyframes drop{0%{transform:translateY(-16px) scale(1.3);opacity:0}60%{opacity:1}100%{transform:translateY(0) scale(1);opacity:1}}

  /* ---------- HUD ---------- */
  .hud{display:flex;width:100%;justify-content:space-between;align-items:center;
    padding:9px 14px;background:rgba(255,255,255,.85);border-radius:20px;margin-top:6px;
    box-shadow:0 3px 10px rgba(0,50,80,.15);flex:0 0 auto;}
  .hud .who{font-size:15px;font-weight:800;color:#0E5E7E;display:flex;align-items:center;gap:6px;}
  .hud .rt{display:flex;align-items:center;gap:10px;}
  .chip{font-size:14px;font-weight:800;color:#7A3A00;background:#FFE29A;padding:5px 13px;border-radius:999px;}
  .homeBtn{font-size:14px;font-weight:800;color:#fff;background:#2E86C1;border:none;
    padding:7px 15px;border-radius:999px;cursor:pointer;box-shadow:0 3px 0 #1B5F8C;}
  .homeBtn:active{transform:translateY(3px);box-shadow:0 0 0;}
  .iconBtn{font-size:15px;background:rgba(255,255,255,.9);border:none;width:34px;height:34px;
    border-radius:50%;cursor:pointer;box-shadow:0 3px 0 #B8D8E8;}

  /* ---------- 屏幕 ---------- */
  .screen{display:none;width:100%;flex:1;flex-direction:column;align-items:center;min-height:0;}
  .screen.on{display:flex;}

  /* ---------- 标题屏 ---------- */
  #titleScreen{justify-content:center;animation:float 3.4s ease-in-out infinite;text-align:center;}
  #titleScreen .island{font-size:clamp(56px,15vw,96px);margin-bottom:6px;filter:drop-shadow(0 8px 10px rgba(0,60,90,.25));}
  .tipLine{margin-top:16px;color:#fff;font-size:14px;font-weight:700;text-shadow:0 2px 6px rgba(0,60,90,.35);}

  /* ---------- 地图屏 ---------- */
  #mapScreen{padding-top:6px;}
  .mapBox{flex:1;width:100%;overflow-y:auto;overflow-x:hidden;padding:10px 6px 14px;
    -webkit-overflow-scrolling:touch;}
  .mapBox::-webkit-scrollbar{width:0;}
  .mapHead{text-align:center;margin-bottom:8px;flex:0 0 auto;}
  .mapHead .t{font-size:22px;font-weight:900;color:#fff;text-shadow:0 3px 0 #1B7FA8;}
  .mapHead .s{font-size:13px;color:#0E5E7E;font-weight:700;margin-top:4px;}
  .path{display:flex;flex-direction:column;align-items:center;gap:2px;}
  .link{width:6px;height:22px;border-radius:3px;background:repeating-linear-gradient(180deg,#F0DFB8 0 6px,transparent 6px 11px);}
  .link.done{background:#FFD98A;}
  .node{display:flex;align-items:center;gap:10px;width:min(100%,430px);cursor:pointer;
    background:rgba(255,255,255,.86);border:3px solid #F0DFB8;border-radius:22px;padding:11px 14px;
    box-shadow:0 5px 0 rgba(0,60,90,.10);transition:transform .12s;}
  .node:nth-child(4n+1){align-self:flex-start;margin-left:2%;}
  .node:nth-child(4n+3){align-self:flex-end;margin-right:2%;}
  .node:active{transform:translateY(3px);}
  .node.locked{background:rgba(255,255,255,.55);border-color:#DCE6EC;color:#8FA6B2;cursor:not-allowed;}
  .node.cur{border-color:#FF8A3D;background:#FFF6E3;animation:pulseNode 1.6s infinite;}
  @keyframes pulseNode{0%,100%{box-shadow:0 5px 0 rgba(0,60,90,.10),0 0 0 0 rgba(255,138,61,.55)}
    50%{box-shadow:0 5px 0 rgba(0,60,90,.10),0 0 0 10px rgba(255,138,61,0)}}
  .node .bld{font-size:36px;flex:0 0 auto;filter:drop-shadow(0 2px 3px rgba(0,60,90,.2));}
  .node.locked .bld{filter:grayscale(1);opacity:.75;}
  .node .txt{flex:1;min-width:0;text-align:left;}
  .node .nm{font-size:17px;font-weight:900;color:#0E5E7E;}
  .node .ds{font-size:12px;color:#5A7A8A;font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .node .stt{flex:0 0 auto;font-size:15px;font-weight:900;color:#C98A00;}
  .node.locked .stt{color:#9DB3BD;}

  /* ---------- 关卡屏 ---------- */
  #stageScreen{padding-top:6px;gap:8px;}
  .bar{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;flex:0 0 auto;}
  .bar .left{display:flex;align-items:center;gap:8px;}
  #statusBar{font-size:clamp(14px,3.8vw,18px);font-weight:800;color:#fff;
    background:rgba(14,94,126,.85);padding:8px 18px;border-radius:999px;min-height:38px;
    text-align:center;max-width:96%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;}
  .panel{width:100%;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(255,255,255,.80);border-radius:24px;padding:14px;min-height:0;overflow:hidden;}
  .qline{font-size:clamp(20px,5.2vw,28px);font-weight:900;color:#0E5E7E;text-align:center;margin-bottom:8px;}
  .qsub{font-size:13px;color:#5A7A8A;font-weight:700;text-align:center;margin-bottom:6px;}

  /* ---------- 贝壳/物品网格 ---------- */
  .pool{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;max-width:100%;}
  .pool span{font-size:clamp(20px,5vw,28px);animation:drop .32s ease-out backwards;}
  .pool.cols{display:grid;gap:6px;}
  .grpwrap{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:flex-start;}
  .grp{background:#FFF6E3;border:2px dashed #F0DFB8;border-radius:16px;padding:8px 10px;
    display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:150px;}
  .grp .glab{width:100%;text-align:center;font-size:11px;font-weight:800;color:#8A6D3B;}

  /* ---------- 键盘 ---------- */
  .pad{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;width:100%;max-width:400px;margin-top:12px;flex:0 0 auto;}
  .pad button{font-size:19px;font-weight:900;color:#0E5E7E;background:linear-gradient(180deg,#fff,#E8F4FA);
    border:2px solid #BDE9FF;border-radius:14px;padding:11px 0;cursor:pointer;box-shadow:0 3px 0 #9BCFE3;}
  .pad button:active{transform:translateY(3px);box-shadow:0 0 0;}
  .pad button.wide{grid-column:span 2;font-size:16px;background:linear-gradient(180deg,#FFE29A,#FFB63D);
    border-color:#FF8A3D;color:#7A3A00;box-shadow:0 3px 0 #D96A1B;}
  .inputBox{min-width:120px;height:56px;padding:0 22px;border-radius:18px;border:3px solid #FF8A3D;
    background:#FFF6E3;font-size:34px;font-weight:900;color:#0E5E7E;display:flex;align-items:center;justify-content:center;}
  .inputBox.bad{border-color:#7FD1C1;color:#2E86C1;animation:shake .32s;}

  /* ---------- 选项 ---------- */
  .opts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:10px;}
  .opt{font-size:26px;font-weight:900;color:#0E5E7E;background:linear-gradient(180deg,#fff,#E8F4FA);
    border:3px solid #BDE9FF;border-radius:18px;padding:12px 24px;cursor:pointer;box-shadow:0 4px 0 #9BCFE3;}
  .opt:active{transform:translateY(4px);box-shadow:0 0 0;}

  /* ---------- S1 分物动画 ---------- */
  .bears{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:8px;}
  .bear{width:62px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .2s;}
  .bear .face{font-size:32px;filter:drop-shadow(0 2px 3px rgba(0,60,90,.2));}
  .bear .own{display:flex;flex-wrap:wrap;gap:1px;justify-content:center;min-height:20px;max-width:58px;}
  .bear .own i{font-size:15px;font-style:normal;animation:pop .26s ease-out backwards;}
  .bear.on{transform:scale(1.18);}
  .counter{font-size:20px;font-weight:900;color:#7A3A00;background:#FFE29A;padding:6px 18px;border-radius:999px;}
  .basket{font-size:30px;margin-bottom:4px;}

  /* ---------- 乘法工具卡 ---------- */
  .toolCard{background:linear-gradient(180deg,#FFF6E3,#FFE9BE);border:3px solid #FFB63D;border-radius:22px;
    padding:14px 16px;text-align:center;animation:pop .4s ease-out;max-width:100%;}
  .toolCard .ttl{font-size:16px;font-weight:900;color:#B25B00;margin-bottom:8px;}
  .toolCard .add{font-size:clamp(15px,4vw,20px);font-weight:900;color:#8A6D3B;line-height:1.5;word-break:break-all;}
  .toolCard .mul{font-size:clamp(26px,7vw,38px);font-weight:900;color:#D9534F;margin-top:8px;}

  /* ---------- 结算屏 ---------- */
  #resultScreen{justify-content:center;gap:10px;text-align:center;padding:0 10px;}
  .resCard{background:rgba(255,255,255,.9);border-radius:26px;padding:24px 22px;width:min(100%,440px);
    box-shadow:0 8px 22px rgba(0,50,80,.2);animation:rise .4s ease-out;}
  .resCard .big{font-size:52px;}
  .resCard .t1{font-size:24px;font-weight:900;color:#0E5E7E;margin-top:4px;}
  .resCard .t2{font-size:15px;color:#5A7A8A;font-weight:700;margin-top:8px;line-height:1.6;}
  .stars{margin-top:10px;font-size:34px;letter-spacing:6px;}

  /* ---------- 棋盘 / 骰子（占地玩法） ---------- */
  .boardWrap{flex:1;display:flex;align-items:center;justify-content:center;width:100%;padding:6px;min-height:0;}
  .board{display:grid;gap:4px;background:rgba(255,255,255,.35);padding:8px;border-radius:18px;
    box-shadow:0 6px 20px rgba(0,50,80,.2);width:min(88vw,52vh,470px);}
  .cell{aspect-ratio:1;border-radius:8px;background:#FFF6E3;border:2px solid #F0DFB8;
    display:flex;align-items:center;justify-content:center;font-size:clamp(11px,2.9vw,17px);font-weight:800;
    color:#8A6D3B;cursor:pointer;transition:all .12s;position:relative;}
  /* 注意：棋盘上不再高亮答案格，乘积由孩子自己算、自己找 */
  .cell.p1{background:#FFE1DA;border-color:#E84C3D;color:#A93226;}
  .cell.p2{background:#DCEBFF;border-color:#2E86C1;color:#17527A;}
  /* 棋子放在右上角，别挡住数字（孩子要自己读数字找格子） */
  .cell .flag{position:absolute;top:-3px;right:-3px;font-size:clamp(10px,2.7vw,15px);line-height:1;
    pointer-events:none;filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 1px #fff);}
  .cell .rc{position:absolute;bottom:1px;left:0;right:0;text-align:center;
    font-size:clamp(7px,1.9vw,10px);font-weight:800;color:#B08A4A;pointer-events:none;}
  .cell.bonus{outline:3px solid #FFB63D;outline-offset:-3px;}
  /* 刚占下这一格得了几分（连片时数字更大） */
  .cell .gain{position:absolute;left:-4px;top:-10px;font-size:clamp(9px,2.3vw,12px);font-weight:900;
    color:#8A4B00;background:#FFD86B;border:1.5px solid #E0A100;border-radius:8px;padding:0 4px;
    pointer-events:none;box-shadow:0 1px 2px rgba(0,0,0,.15);}
  .cell .gain.g2{color:#17527A;background:#CFE6FA;border-color:#5FA8D8;}   /* 机器人这一手的得分 */
  .goalStrip{font-size:clamp(14px,3.6vw,17px);font-weight:900;color:#7A3A00;background:#FFE29A;
    border:2px solid #F0C26B;border-radius:999px;padding:6px 16px;margin:8px 0 4px;text-align:center;max-width:96%;}
  .goalStrip.wait{background:#E8F4FA;border-color:#BDE9FF;color:#0E5E7E;}
  /* 规则卡 + 难度/模式选择器一起打开时，让整个面板滚动：
     卡片不再单独截断文案，孩子从上往下滑一遍就能看完 */
  .panel.rulesOpen{justify-content:flex-start;overflow-y:auto;}
  .panel.rulesOpen .rulesCard{max-height:none;overflow:visible;}
  .rulesCard{background:#FFFDF5;border:2px solid #F0DFB8;border-radius:20px;padding:14px 16px;
    width:min(100%,420px);max-height:58vh;overflow-y:auto;}
  .rulesCard .rTitle{font-size:19px;font-weight:900;color:#0E5E7E;text-align:center;margin-bottom:10px;}
  .rulesCard .rItem{font-size:15px;font-weight:800;color:#5A7A8A;line-height:1.7;margin:6px 0;text-align:left;}
  /* ---------- 机器人难度三档 ---------- */
  .diffPick,.modePick{width:min(100%,420px);margin-top:12px;background:#F3FAFF;border:2px solid #C6E6F7;
    border-radius:18px;padding:10px 12px;}
  .diffPick .dpT,.modePick .dpT{font-size:13px;font-weight:900;color:#0E5E7E;text-align:center;margin-bottom:8px;}
  .diffPick .dpRow,.modePick .dpRow{display:flex;gap:8px;justify-content:center;}
  .dpBtn{flex:1;max-width:118px;background:#fff;border:2px solid #CFE6F3;border-radius:14px;
    padding:6px 2px 5px;cursor:pointer;text-align:center;transition:all .15s;}
  .dpBtn .dpIc{font-size:20px;line-height:1.1;}
  .dpBtn .dpN{font-size:13px;font-weight:900;color:#7A8FA0;margin-top:1px;}
  .dpBtn.easy.on{background:#E9FBEF;border-color:#4FC17C;box-shadow:0 3px 0 #4FC17C;}
  .dpBtn.mid.on{background:#FFF6DF;border-color:#F0C26B;box-shadow:0 3px 0 #F0C26B;}
  .dpBtn.hard.on{background:#FFECE4;border-color:#F08A5C;box-shadow:0 3px 0 #F08A5C;}
  .dpBtn.easy.on .dpN{color:#1D7A50;} .dpBtn.mid.on .dpN{color:#9A6A00;} .dpBtn.hard.on .dpN{color:#C2462A;}
  .diffPick .dpNote,.modePick .dpNote{font-size:11.5px;font-weight:800;color:#6B8494;text-align:center;margin-top:7px;line-height:1.5;}
  .diffChip{display:inline-block;font-size:11px;font-weight:900;border-radius:999px;padding:1px 8px;
    border:1.5px solid;margin-left:5px;vertical-align:middle;}
  .diffChip.easy{background:#E9FBEF;color:#1D7A50;border-color:#4FC17C;}
  .diffChip.mid {background:#FFF6DF;color:#9A6A00;border-color:#F0C26B;}
  .diffChip.hard{background:#FFECE4;color:#C2462A;border-color:#F08A5C;}
  /* ---------- 对战模式（人机 / 人人）---------- */
  .modePick{background:#FFF7EC;border-color:#F5D9A8;}
  .modePick .dpT{color:#7A3A00;}
  .mpBtn{max-width:150px;}
  .mpBtn.ai.on{background:#EAF4FF;border-color:#5AA9E6;box-shadow:0 3px 0 #5AA9E6;}
  .mpBtn.p2.on{background:#FDEBFF;border-color:#B479D6;box-shadow:0 3px 0 #B479D6;}
  .mpBtn.ai.on .dpN{color:#14628F;} .mpBtn.p2.on .dpN{color:#7A3A9E;}
  .diffChip.p2{background:#FDEBFF;color:#7A3A9E;border-color:#B479D6;}
  .diffChip.ai{background:#EAF4FF;color:#14628F;border-color:#5AA9E6;}
  .diceArea{display:flex;gap:12px;margin:6px 0 2px;flex:0 0 auto;}
  .die{width:clamp(46px,12vw,62px);height:clamp(46px,12vw,62px);border-radius:16px;
    background:linear-gradient(180deg,#fff,#E8F4FA);border:3px solid #BDE9FF;
    display:flex;align-items:center;justify-content:center;font-size:clamp(22px,6vw,30px);font-weight:900;
    color:#0E5E7E;box-shadow:0 4px 0 #9BCFE3;cursor:pointer;transition:all .15s;}
  .die.selected{background:linear-gradient(180deg,#FFE29A,#FFB63D);border-color:#FF8A3D;color:#7A3A00;
    transform:translateY(-6px) scale(1.08);box-shadow:0 8px 0 #D96A1B;}
  .die.rolling{animation:roll .4s linear infinite;}
  @keyframes roll{0%{transform:rotate(0)}25%{transform:rotate(8deg) scale(1.1)}75%{transform:rotate(-8deg)}100%{transform:rotate(0)}}
  .scoreRow{display:flex;gap:8px;justify-content:center;flex:0 0 auto;}
  .scoreBox{text-align:center;background:rgba(255,255,255,.82);border-radius:14px;padding:3px 11px;min-width:84px;}
  .scoreBox.mid{background:rgba(255,255,255,.55);}
  .scoreLbl{font-size:10.5px;font-weight:800;color:#5A7A8A;white-space:nowrap;}
  .scoreNum{font-size:21px;font-weight:900;line-height:1.15;}
  .scoreSub{font-size:9.5px;font-weight:700;color:#93A2AE;white-space:nowrap;}
  .s1c{color:#E84C3D;} .s2c{color:#2E86C1;} .sgc{color:#C98A00;} .turnc{color:#0E5E7E;}
  /* 掷不出来的数字 = 海（演习岛上不用管它） */
  .cell.sea{background:#DCEFF8;border-color:#C4E2F2;color:#B4D4E6;cursor:default;}
  .cell.sea .rc{color:#C2DBE9;}

  /* ---------- 铺地砖 / 货箱阵列 ---------- */
  .tileGrid{display:grid;gap:5px;justify-content:center;margin:6px 0;}
  .tile{width:clamp(28px,8vw,42px);height:clamp(28px,8vw,42px);border-radius:8px;
    border:2px dashed #C9DCE6;background:#fff;display:flex;align-items:center;justify-content:center;
    font-size:19px;cursor:pointer;transition:all .15s;}
  .tile.on{background:#F5C26B;border:2px solid #E09B2D;animation:pop .25s ease-out;}
  .tile.flash{background:#FFF0BF;border-color:#E09B2D;}
  .tile.on.flash{background:#FFDE8A;animation:rowIn .4s ease-out;}
  .rowBar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0 0;}
  .rowBar .ghostBtn{font-size:15px;padding:8px 16px;}
  @keyframes rowIn{0%{transform:translateY(-12px);opacity:.35;}60%{transform:translateY(2px);opacity:1;}100%{transform:none;}}
  .crateGrid{display:grid;gap:4px;justify-content:center;margin:6px 0;}
  .miniDot{display:inline-block;width:8px;height:8px;border-radius:2px;margin:1px;animation:drop .3s ease-out backwards;}
  .miniGrid{display:grid;gap:3px;width:100%;justify-content:center;margin:0 auto;}
  .miniGrid .miniDot{width:100%;height:clamp(7px,2vw,10px);margin:0;border-radius:2px;}
  .miniDot.d1{background:#E0A030;} .miniDot.d2{background:#D9734A;}
  .crate{width:clamp(17px,4.4vw,25px);height:clamp(17px,4.4vw,25px);border-radius:5px;
    background:#C98A3D;border:1px solid #A96F2B;display:flex;align-items:center;justify-content:center;font-size:11px;}
  .crate.lite{background:#E3B778;}

  /* ---------- 拆箱教学 ---------- */
  .splitWrap{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#FFF6E3;
    border:2px solid #F0DFB8;border-radius:16px;padding:10px;max-width:340px;}
  .splitBox{border-radius:10px;padding:6px;display:flex;flex-wrap:wrap;gap:3px;justify-content:center;align-items:flex-start;}
  .splitNote{font-size:12px;font-weight:800;color:#7A5230;text-align:center;max-width:340px;margin-top:2px;}
  .sb1{background:#FFE29A;} .sb2{background:#FFD0A6;} .sb3{background:#D6E9FF;} .sb4{background:#D8F0D0;}
  .splitLbl{width:100%;text-align:center;font-size:12px;font-weight:900;color:#7A3A00;}

  /* ---------- 账单 / 店铺 ---------- */

  acc:{},chant:{},diff:{},mode:{},created:Date.now()};}

function loadProg(){
  try{var raw=localStorage.getItem(KEY_PROG);if(raw){var d=JSON.parse(raw);if(d&&typeof d==="object"){
    P={stars:d.stars||{},plays:d.plays||{},days:d.days||0,lastDay:d.lastDay||"",firstDay:d.firstDay||"",
       s0:d.s0||{ok:0,best:0,done:false},s1:d.s1||{done:0,best:0},acc:d.acc||{},
       chant:d.chant||{},diff:d.diff||{},mode:d.mode||{},created:d.created||Date.now()};}}}catch(e){}

/* ---------- 云同步（优雅降级：字段未建也能玩） ---------- */
function tcbReady(){return !!(TCB_CFG.envId&&TCB_CFG.accessKey)&&!IS_GUEST;}
function tcbUrl(){return "https://"+TCB_CFG.envId+".api.tcloudbasegateway.com/v1/rdb/rest/"+TCB_TABLE;}
var pushTimer=null,cloudOk=true;
function pushIsland(){if(!tcbReady()||!cloudOk)return;
  if(pushTimer)clearTimeout(pushTimer);
  pushTimer=setTimeout(function(){
    fetch(tcbUrl(),{method:"POST",
      headers:{"Authorization":"Bearer "+TCB_CFG.accessKey,"Content-Type":"application/json","Prefer":"resolution=merge-duplicates"},
      body:JSON.stringify({username:USER,island:P})}).catch(function(){cloudOk=false;});
  },600);}
function pullIsland(){if(!tcbReady())return;
  fetch(tcbUrl()+"?select=island&username=eq."+encodeURIComponent(USER),
    {headers:{"Authorization":"Bearer "+TCB_CFG.accessKey}})
   .then(function(r){return r.json();}).then(function(arr){
    if(!arr||!arr.length)return;
    var c=arr[0]&&arr[0].island;if(!c)return;
    if(typeof c==="string"){try{c=JSON.parse(c);}catch(e){return;}}
    mergeCloud(c);
  }).catch(function(){cloudOk=false;});}
function mergeCloud(c){
  var change=false;
  for(var k in c.stars||{}){if((P.stars[k]||0)<c.stars[k]){P.stars[k]=c.stars[k];change=true;}}
  if((c.days||0)>(P.days||0)){P.days=c.days;change=true;}
  if((c.s0&&c.s0.best||0)>(P.s0.best||0)){P.s0.best=c.s0.best;P.s0.done=true;change=true;}
  if((c.s1&&c.s1.best||0)>(P.s1.best||0)){P.s1.best=c.s1.best;change=true;}
  /* 练习数据（正确率）：谁的样本多就用谁的，两边都不丢 */
  for(var ak in c.acc||{}){var ca=c.acc[ak]||{},pa=P.acc[ak]||{ok:0,tot:0,err:0};
    if((ca.tot||0)>(pa.tot||0)){P.acc[ak]={ok:ca.ok||0,tot:ca.tot||0,err:ca.err||0};change=true;}}
  /* 口诀背诵记录：取练习量更大的一边 */
  for(var ck2 in c.chant||{}){var cv=c.chant[ck2]||{},pv=P.chant[ck2]||{ok:0,bad:0};
    if(((cv.ok||0)+(cv.bad||0))>((pv.ok||0)+(pv.bad||0))){P.chant[ck2]={ok:cv.ok||0,bad:cv.bad||0};change=true;}}
  /* 机器人难度：以本机为准（孩子在哪个难度练过就记住哪个） */
  for(var dk in c.diff||{}){if(!P.diff[dk]){P.diff[dk]=c.diff[dk];change=true;}}
  /* 对战模式（人机 / 人人）：同样以本机为准 */
  for(var mk2 in c.mode||{}){if(!P.mode[mk2]){P.mode[mk2]=c.mode[mk2];change=true;}}
  if(change){try{localStorage.setItem(KEY_PROG,JSON.stringify(P));}catch(e){}}
}

/* ---------- 音效（Web Audio 程序化，无失败音） ---------- */
var SND=(function(){
  var ctx=null,on=true;
  try{on=localStorage.getItem(KEY_CFG)!=="off";}catch(e){}
  function ac(){if(!ctx){try{ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){ctx=null;}}return ctx;}
  function tone(freq,dur,type,vol,delay){
    if(!on)return;var c=ac();if(!c)return;
    var t0=c.currentTime+(delay||0);
    var o=c.createOscillator(),g=c.createGain();
    o.type=type||"sine";o.frequency.setValueAtTime(freq,t0);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol||0.18,t0+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g);g.connect(c.destination);o.start(t0);o.stop(t0+dur+0.02);}
  return {
    set:function(v){on=v;try{localStorage.setItem(KEY_CFG,v?"on":"off");}catch(e){}},
    toggle:function(){this.set(!on);return on;},
    isOn:function(){return on;},
    tap:function(){tone(660,0.09,"sine",0.14,0);},
    good:function(){tone(784,0.13,"triangle",0.2,0);tone(1046,0.22,"triangle",0.18,0.1);},
    step:function(){tone(520,0.07,"square",0.07,0);},
    win:function(){[523,659,784,1046].forEach(function(f,i){tone(f,0.26,"triangle",0.18,i*0.11);});},
    hint:function(){tone(440,0.12,"sine",0.12,0);tone(554,0.16,"sine",0.12,0.09);},
    again:function(){tone(392,0.14,"sine",0.12,0);tone(349,0.2,"sine",0.1,0.1);}
  };
})();

function bindPad(onOk,maxLen){

/* ---------- 通用：练习数据统计（给家长复盘用：正确率 / 知识点掌握度） ---------- */
var ASt=null;   /* 当前这一局的临时统计 */
function statStart(id){ASt={id:id,ok:0,tot:0,err:0};}
function statQ(got){if(!ASt)return;ASt.tot++;if(got)ASt.ok++;else ASt.err++;}
function statCommit(id){
  if(!ASt)return;
  var sid=id||ASt.id,a=P.acc[sid]||(P.acc[sid]={ok:0,tot:0,err:0});
  a.ok+=ASt.ok;a.tot+=ASt.tot;a.err+=ASt.err;a.last=Date.now();
  ASt=null;
}
function accOf(id){return P.acc[id]||null;}
function accRate(id){var a=accOf(id);if(!a||!a.tot)return -1;return a.ok/a.tot;}
function accAll(){var ok=0,tot=0;for(var k in P.acc){ok+=P.acc[k].ok||0;tot+=P.acc[k].tot||0;}return {ok:ok,tot:tot,rate:tot?ok/tot:-1};}

/* ---------- 通用：结算 ---------- */
function finishStage(id,stars,title,desc){
  var old=P.stars[id]||0;if(stars>old)P.stars[id]=stars;
  P.plays[id]=(P.plays[id]||0)+1;statCommit(id);saveProg();
  if(stars>=1)SND.win();else SND.hint();
  var s="";for(var i=0;i<3;i++){s+=(i<stars?"⭐":"☆");}
  $("resCard").innerHTML=
    '<div class="big">'+(stars>=3?"🏆":(stars>=1?"🎉":"🌱"))+"</div>"+
    '<div class="t1">'+title+"</div><div class=\"stars\">"+s+"</div>"+
    '<div class="t2">'+desc+"</div>"+
    '<div style="margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">'+
    '<button class="ghostBtn" onclick="backToMap()">🗺️ 回地图</button>'+
    '<button class="bigBtn" style="padding:12px 30px;font-size:18px" onclick="replay(\''+id+'\')">再玩一次</button></div>';
  show("resultScreen");
}
function replay(id){var st=stageById(id);if(st)startStage(st);}

/* =========================================================
   S0 上岛检查：数贝壳 · 一群一群数 · 20以内小口算
   ========================================================= */
var TF=null;
function stopTimer(){if(TF){clearTimeout(TF);clearInterval(TF);TF=null;}}

var S0=null;
function playS0(){
  stopTimer();
  S0={qs:genS0(),idx:0,ok:0,tries:0};
  statStart("S0");
  say("🐚 上岛检查开始！船长要看看你数得准不准");
  renderS0();
}
function genS0(){
  var qs=[];
  /* ① 数一数：6-20 个 */
  var n1=ri(6,20),ic1=pick(["🐚","⭐","🍎","🌰"]);
  qs.push({kind:"count",icon:ic1,n:n1,ans:n1,ask:"一共有几个 "+ic1+" ？"});
  /* ② 一群一群数：3-4 群 × 2-5 个 */
  var g=ri(3,4),p=ri(2,5),ic2=pick(["🐟","🐚","🌰","🍓"]);
  qs.push({kind:"group",icon:ic2,g:g,p:p,ans:g*p,ask:""+g+" 群，每群 "+p+" 个，一共几个？"});
  /* ③ 20 以内加减 */
  var a,b;
  if(Math.random()<0.5){a=ri(10,19);b=ri(2,9);qs.push({kind:"calc",ask:""+a+" − "+b+" = ?",ans:a-b});}
  else{a=ri(3,9);b=ri(2,9);qs.push({kind:"calc",ask:""+a+" + "+b+" = ?",ans:a+b});}
  return qs;
}
function renderS0(){
  var q=S0.qs[S0.idx];
  var h='<div class="qline">'+q.ask+"</div>";
  if(q.kind==="count"){
    var cols=Math.min(10,q.n);
    h+='<div class="pool cols" style="grid-template-columns:repeat('+cols+',1fr)">';
    for(var i=0;i<q.n;i++){h+='<span style="animation-delay:'+(i*0.03).toFixed(2)+'s">'+q.icon+"</span>";}
    h+="</div>";
    h+='<div class="qsub">一个一个数也行，几个几个数更快</div>';
  } else if(q.kind==="group"){
    h+='<div class="grpwrap">';
    for(var gi=0;gi<q.g;gi++){
      h+='<div class="grp">';
      for(var j2=0;j2<q.p;j2++){h+='<span style="animation-delay:'+((gi*q.p+j2)*0.03).toFixed(2)+'s">'+q.icon+"</span>";}
      h+='<div class="glab">第 '+(gi+1)+" 群</div></div>";
    }
    h+="</div>";
    h+='<div class="qsub">一群一群地数，会快很多哦</div>';
  } else {
    h+='<div style="font-size:64px;font-weight:900;color:#0E5E7E">'+q.ask+"</div>";
    h+='<div class="qsub">用小手指头或者画画杠杠来算</div>';
  }
  h+='<div class="inputBox" id="inputBox"></div>'+padHTML();
  $("panel").innerHTML=h;
  say("第 "+(S0.idx+1)+" / "+S0.qs.length+" 小关");
  bindPad(checkS0,2);
}
function checkS0(v){
  var q=S0.qs[S0.idx];
  if(!q._rec){q._rec=1;statQ(v===q.ans);}   /* 只记第一次作答，用于正确率 */
  if(v===q.ans){
    S0.ok++;S0.tries=0;SND.good();say("答对啦！");
    S0.idx++;
    if(S0.idx>=S0.qs.length){TF=setTimeout(endS0,700);return;}
    TF=setTimeout(renderS0,620);
    return;
  }
  S0.tries++;SND.again();
  var box=$("inputBox");
  if(box){box.textContent="";box.className="inputBox bad";setTimeout(function(){if(box)box.className="inputBox";},340);}
  /* 同一题最多试 3 次：公布答案后继续，不羞辱、不卡死 */
  if(S0.tries>=3){
    S0.tries=0;S0.idx++;
    say("这题是 "+q.ans+" 呀，记住它～我们继续");
    if(S0.idx>=S0.qs.length){TF=setTimeout(endS0,900);return;}
    TF=setTimeout(renderS0,1200);
    return;
  }
  say(S0.tries>=2?("再数一遍～ "+s0Hint(q)):"差一点点，再想想～");
}
function s0Hint(q){
  if(q.kind==="group")return ""+q.p+" 个 "+q.p+" 个地数，要数 "+q.g+" 次";
  if(q.kind==="count")return "试试两个两个、或者五个五个数";
  return "用小棒或者手指头数一数";
}
function endS0(){
  var ok=S0.ok;
  P.s0.ok=ok;P.s0.done=true;if(ok>P.s0.best)P.s0.best=ok;saveProg();
  if(ok>=3)finishStage("S0",3,"检查通过！","船长说：数得又准又快，欢迎上岛 🏝️");
  else if(ok===2)finishStage("S0",2,"过关啦","船长说：基本过关，明天再练一遍会更熟～");
  else finishStage("S0",1,"慢慢来","船长说：我们先常常数贝壳，练练再上岛。<br>（现在也可以继续往前玩哦）");
}

/* =========================================================
   S1 分草莓：一个一个分 → 数出总数 → 弹出乘法工具
   （本关前半段不出现算式，最后才揭示「这就是乘法」）
   ========================================================= */
/* 场景池：全部是水果（第 1 场固定分草莓，呼应关卡名） */
var S1_POOL=[
 {own:"🐻",happy:"😋",item:"🍓",nm:"草莓",q:"颗",n:6,per:4},
 {own:"🐰",happy:"😋",item:"🍎",nm:"苹果",q:"个",n:5,per:3},
 {own:"🐿️",happy:"😋",item:"🍒",nm:"樱桃",q:"颗",n:4,per:5},
 {own:"🐥",happy:"😋",item:"🍇",nm:"葡萄",q:"串",n:7,per:2},
 {own:"🐸",happy:"😋",item:"🍊",nm:"橘子",q:"个",n:3,per:6}
];
var S1=null;
function playS1(){
  stopTimer();
  /* 第一场固定「分草莓」作示范，其余随机抽 2 场 */
  var rest=S1_POOL.slice(1);
  for(var i=rest.length-1;i>0;i--){var j=ri(0,i);var t=rest[i];rest[i]=rest[j];rest[j]=t;}
  S1={scenes:[S1_POOL[0]].concat(rest.slice(0,2)),idx:0,ok:0,tries:0,cur:0};
  statStart("S1");
  renderS1();
}
function renderS1(){
  stopTimer();
  S1.cur=0;S1.tries=0;
  say("🍓 把水果公平分给每一只小动物，看看一共要用多少");
  drawS1();
  TF=setTimeout(giveStep,720);
}
function drawS1(){
  var sc=S1.scenes[S1.idx],k=S1.cur,h="";
  h+='<div class="qline">把 '+sc.nm+" 分给 "+sc.n+" 只 "+sc.own+" 吧</div>";
  h+='<div class="basket">🧺'+sc.item+"</div>";
  h+='<div class="bears">';
  for(var i=0;i<sc.n;i++){
    var cnt=(i<k)?sc.per:0;
    h+='<div class="bear'+(i===k?" on":"")+'"><div class="face">'+(cnt?sc.happy:sc.own)+"</div><div class=\"own\">";
    for(var j=0;j<cnt;j++){h+='<i style="animation-delay:'+(j*0.09).toFixed(2)+'s">'+sc.item+"</i>";}
    h+="</div></div>";
  }
  h+="</div>";
  h+='<div class="counter">已经分给 <span id="cntNum">'+k+"</span> 只 "+sc.own+" · 自己数一数一共多少</div>";
  $("panel").innerHTML=h;
}
function giveStep(){
  var sc=S1.scenes[S1.idx];
  if(S1.cur>=sc.n){TF=setTimeout(askS1,420);return;}
  drawS1();SND.step();
  S1.cur++;
  TF=setTimeout(giveStep, sc.per>=5?760:620);
}
function askS1(){
  var sc=S1.scenes[S1.idx];
  drawS1();
  var h=$("panel").innerHTML;
  h+='<div class="qline" style="margin-top:12px">一共分出去了多少'+sc.nm+"？</div>";
  h+='<div class="inputBox" id="inputBox"></div>'+padHTML();
  h+='<div class="qsub" style="margin-top:8px">数不清？<a href="javascript:void(0)" onclick="renderS1()" style="color:#2E86C1;font-weight:800">↺ 再慢慢分一次</a></div>';
  $("panel").innerHTML=h;
  say("数一数，一共分出去多少"+sc.nm+"？");
  bindPad(checkS1,2);
}
function checkS1(v){
  var sc=S1.scenes[S1.idx],ans=sc.n*sc.per;
  var qk=S1.qs_rec||(S1.qs_rec={});
  if(!qk[S1.idx]){qk[S1.idx]=1;statQ(v===ans);}
  if(v===ans){SND.good();TF=setTimeout(function(){showTool(true);},320);return;}
  S1.tries++;SND.again();
  var box=$("inputBox");
  if(box){box.textContent="";box.className="inputBox bad";setTimeout(function(){if(box)box.className="inputBox";},340);}
  /* 同一场景最多试 3 次：公布答案后照样给乘法工具，只是不计入答对数 */
  if(S1.tries>=3){
    S1.tries=0;
    say("一共是 "+ans+" "+sc.q+sc.nm+"～ 记住它");
    TF=setTimeout(function(){showTool(false);},900);
    return;
  }
  say(S1.tries>=2?(""+sc.n+" 只，每只 "+sc.per+sc.q+"。再数数～"):"差一点点，再数数～");
}
function showTool(credit){
  stopTimer();
  var sc=S1.scenes[S1.idx],ans=sc.n*sc.per,parts=[];
  for(var i=0;i<sc.n;i++)parts.push(sc.per);
  if(credit)S1.ok++;
  $("panel").innerHTML=
    '<div class="qline">'+(credit?"用到 ":"一共 ")+ans+" "+sc.q+sc.nm+"！</div>"+
    '<div class="toolCard"><div class="ttl">🧰 乘法工具</div>'+
    '<div class="add">'+parts.join(" + ")+" = "+ans+"</div>"+
    '<div class="add" style="font-size:13px;margin-top:6px">'+sc.n+" 份 "+sc.per+sc.q+" 加在一起，写起来好长呀</div>"+
    '<div class="mul">'+sc.n+" × "+sc.per+" = "+ans+"</div>"+
    '<div class="add" style="font-size:13px;margin-top:4px">乘法，就是把「一样多的几份」合起来</div></div>'+
    '<div style="margin-top:14px"><button class="bigBtn" style="padding:12px 32px;font-size:19px" onclick="nextS1()">'+
    (S1.idx>=S1.scenes.length-1?"完成啦 🎉":"下一个 →")+"</button></div>";
  say("看！乘法就是这样来的～");
  SND.win();
}
function nextS1(){
  stopTimer();S1.idx++;
  if(S1.idx>=S1.scenes.length){endS1();return;}
  renderS1();
}
function endS1(){
  stopTimer();
  if(S1.ok>P.s1.best)P.s1.best=S1.ok;
  P.s1.done=S1.ok;saveProg();
  var st=S1.ok>=3?3:(S1.ok===2?2:1);
  finishStage("S1",st,"分得真公平！","你发现了：把一样多的几份合起来，就是乘法！");
}

/* =========================================================
   通用答题引擎（S3a / S3b / S3c / S3.5 / S5 / 毕业 共用）
   cfg = {n, tip, timer, gen(i)->{ask,ans,html,hint,right}, stars(ok,total), ...}
   ========================================================= */
var QZ=null,QZT=null,QZPT=null;
function stopQuizTimer(){if(QZT){clearInterval(QZT);QZT=null;}}
function clearPerQ(){if(QZPT){clearTimeout(QZPT);QZPT=null;}}
function runQuiz(id,cfg){
  stopTimer();stopQuizTimer();clearPerQ();
  QZ={id:id,cfg:cfg,qs:[],idx:0,ok:0,tries:0,left:cfg.timer||0};
  statStart(id);
  for(var i=0;i<cfg.n;i++)QZ.qs.push(cfg.gen(i));
  if(cfg.timer){
    QZT=setInterval(function(){
      if(!QZ)return;
      QZ.left--;
      var tl=$("tLeft");if(tl)tl.textContent=QZ.left;
      var bar=$("timeBar");
      if(bar)bar.innerHTML='<i style="width:'+Math.max(0,QZ.left/cfg.timer*100)+'%"></i>';
      if(QZ.left<=0){stopQuizTimer();endQuiz();}
    },1000);
  }
  renderQuizQ();
}
function renderQuizQ(){
  clearPerQ();
  var q=QZ.qs[QZ.idx],h="";
  if(QZ.cfg.timer){
    h+='<div class="qsub">⏱️ 还剩 <b id="tLeft">'+QZ.left+"</b> 秒 · 已答对 "+QZ.ok+" 题</div>";
    h+='<div class="timeBar" id="timeBar"><i style="width:'+(QZ.left/QZ.cfg.timer*100)+'%"></i></div>';
  } else if(QZ.cfg.perQ){
    h+='<div class="qsub">🎖️ 第 '+(QZ.idx+1)+" / "+QZ.qs.length+" 题 · "+QZ.cfg.perQ+" 秒内抢答</div>";
  } else {
    h+='<div class="qsub">第 '+(QZ.idx+1)+" / "+QZ.qs.length+" 题</div>";
  }
  h+='<div class="qline">'+q.ask+"</div>";
  if(q.html)h+=q.html;
  h+='<div class="inputBox" id="inputBox"></div>'+padHTML();
  $("panel").innerHTML=h;
  say(QZ.cfg.tip||"算一算，填进去");
  bindPad(checkQuiz,3);
  if(QZ.cfg.perQ)QZPT=setTimeout(quizTimeout,(QZ.cfg.perQ)*1000);
}
function quizTimeout(){
  var q=QZ.qs[QZ.idx];
  if(!q._rec){q._rec=1;statQ(false);}
  SND.hint();say("时间到～ 是 "+q.ans+" 呀");
  QZ.idx++;
  if(QZ.idx>=QZ.qs.length){TF=setTimeout(endQuiz,900);return;}
  TF=setTimeout(renderQuizQ,1200);
}
function checkQuiz(v){
  var q=QZ.qs[QZ.idx];
  if(!q._rec){q._rec=1;statQ(v===q.ans);}
  if(v===q.ans){
    clearPerQ();
    QZ.ok++;QZ.tries=0;SND.good();say(q.right||"答对啦！");
    QZ.idx++;
    if(QZ.idx>=QZ.qs.length){stopQuizTimer();TF=setTimeout(endQuiz,650);return;}
    TF=setTimeout(renderQuizQ,540);return;
  }
  QZ.tries++;SND.again();
  var box=$("inputBox");
  if(box){box.textContent="";box.className="inputBox bad";setTimeout(function(){if(box)box.className="inputBox";},340);}
  if(QZ.cfg.timer){
    /* 限时赛：答错就跳过，别让孩子在同一个题上耗光秒数 */
    QZ.tries=0;QZ.idx++;
    say("这题是 "+q.ans+" 呀，下一题～");
    if(QZ.idx>=QZ.qs.length){stopQuizTimer();TF=setTimeout(endQuiz,800);return;}
    TF=setTimeout(renderQuizQ,900);return;
  }
  if(QZ.tries>=3){
    QZ.tries=0;QZ.idx++;
    say("这题是 "+q.ans+" 呀，记住它～");
    if(QZ.idx>=QZ.qs.length){stopQuizTimer();TF=setTimeout(endQuiz,900);return;}
    TF=setTimeout(renderQuizQ,1100);return;
  }
  say(QZ.tries>=2?("再想想～ "+(q.hint||"")):"差一点点，再想想～");
}
function endQuiz(){
  stopQuizTimer();clearPerQ();
  var c=QZ.cfg,ok=QZ.ok,tot=QZ.qs.length;
  var st=c.stars?c.stars(ok,tot):starsByRate(ok,tot);
  var ti=c.doneTitle||"完成啦";if(typeof ti==="function")ti=ti(ok,tot);
  finishStage(QZ.id,st,ti,c.doneDesc?c.doneDesc(ok,tot):("答对 "+ok+" / "+tot+" 题"));
}
function starsByRate(ok,total){var r=total?ok/total:0;if(r>=0.9)return 3;if(r>=0.7)return 2;return 1;}

/* =========================================================
   S2 铺地砖：点格子铺砖 → 数总数；再把大方阵拆成两块算
   ========================================================= */
var S2_TILES=[{r:3,c:4},{r:4,c:5},{r:5,c:3},{r:6,c:4},{r:4,c:6},{r:3,c:5}];
var S2_SPLITS=[{r:7,c:8,a:5},{r:6,c:9,a:4},{r:8,c:7,a:3},{r:5,c:9,a:6}];
var S2=null;
function playS2(){
  stopTimer();
  var pool=S2_TILES.slice();
  for(var i=pool.length-1;i>0;i--){var j=ri(0,i);var t=pool[i];pool[i]=pool[j];pool[j]=t;}
  var sp=S2_SPLITS.slice();
  for(var k=sp.length-1;k>0;k--){var j2=ri(0,k);var t2=sp[k];sp[k]=sp[j2];sp[j2]=t2;}
  S2={tiles:pool.slice(0,3),splits:sp.slice(0,2),ti:0,si:0,ok:0,tries:0,phase:"tile",laid:[],spq:[],spi:0};
  statStart("S2");
  renderS2Tile();
}
function renderS2Tile(){
  var t=S2.tiles[S2.ti];
  S2.laid=[];for(var i=0;i<t.r*t.c;i++)S2.laid.push(false);
  S2.phase="tile";S2.tries=0;S2.flashRow=undefined;S2.busy=false;
  say("🧱 把地面铺满： "+t.r+" 行 × "+t.c+" 列（点格子，或按「一排一排铺」一次铺一排）");
  drawS2Tile();
}
function drawS2Tile(){
  var t=S2.tiles[S2.ti],n=0,h="",rr=0,cc=0,fullRows=0;
  for(var i=0;i<t.r*t.c;i++){if(S2.laid[i])n++;}
  for(rr=0;rr<t.r;rr++){var all=true;
    for(cc=0;cc<t.c;cc++){if(!S2.laid[rr*t.c+cc])all=false;}
    if(all)fullRows++;}
  var extra=n-fullRows*t.c;                 /* 没铺齐的那一排里点了几块 */
  h+='<div class="qline">铺一个 '+t.r+" 行 "+t.c+" 列 的地面</div>";
  h+='<div class="tileGrid" id="tileGrid" style="grid-template-columns:repeat('+t.c+',1fr)">';
  for(var j=0;j<t.r*t.c;j++){
    var fr=(S2.flashRow!==undefined&&S2.flashRow===Math.floor(j/t.c));
    h+='<div class="tile'+(S2.laid[j]?" on":"")+(fr?" flash":"")+'" data-i="'+j+'">'+(S2.laid[j]?"🧱":"")+"</div>";}
  h+="</div>";
  /* 注意：绝不能把总块数印出来 —— 只说「铺了几排、每排几块」，剩下的让孩子自己乘/自己数 */
  var full=(n>=t.r*t.c);
  h+='<div class="counter">'+(full?"✅ 铺满啦 · 自己数一数"
     :("已铺 "+fullRows+" 排"+(extra?(" + "+extra+" 块"):"")+" · 每排 "+t.c+" 块 · 还剩 "+(t.r-fullRows)+" 排"))+"</div>";
  h+='<div class="rowBar"><button class="ghostBtn" id="rowFill">➡️ 一排一排铺</button></div>';
  $("panel").innerHTML=h;
  var g=$("tileGrid");
  if(g)g.addEventListener("click",function(ev){
    var kk=ev.target.getAttribute("data-i");
    if(kk===null||kk===undefined)return;
    var k=parseInt(kk,10);
    if(S2.phase!=="tile"||S2.laid[k]||S2.busy)return;
    S2.flashRow=undefined;S2.laid[k]=true;SND.step();drawS2Tile();
    afterS2Tile();
  });
  var rf=$("rowFill");if(rf)rf.addEventListener("click",fillRowS2);
}
/* 一排一排铺：一次把「还没铺满的最近一排」整排铺好 —— 让孩子看清「一排有几块、铺了几排」 */
function fillRowS2(){
  if(S2.phase!=="tile"||S2.busy)return;
  var t=S2.tiles[S2.ti],r=-1,rr,cc;
  for(rr=0;rr<t.r;rr++){var all=true;
    for(cc=0;cc<t.c;cc++){if(!S2.laid[rr*t.c+cc])all=false;}
    if(!all){r=rr;break;}}
  if(r<0)return;
  SND.step();
  for(cc=0;cc<t.c;cc++)S2.laid[r*t.c+cc]=true;
  S2.flashRow=r;
  drawS2Tile();
  say("这一排 "+t.c+" 块 · 已经铺了 "+(r+1)+" 排，还剩 "+(t.r-r-1)+" 排");
  afterS2Tile();
}
function afterS2Tile(){
  var t=S2.tiles[S2.ti],done=true;
  for(var z=0;z<S2.laid.length;z++){if(!S2.laid[z])done=false;}
  if(done){S2.busy=true;TF=setTimeout(function(){S2.busy=false;askS2();},420);}
}
function askS2(){
  S2.phase="ask";drawS2Tile();
  var t=S2.tiles[S2.ti];
  var h=$("panel").innerHTML;
  h=h.replace(/<div class="rowBar">[\s\S]*?<\/div>/,"");   /* 答题时收起「一排一排铺」按钮 */
  h+='<div class="qline" style="margin-top:10px">一共铺了多少块地砖？</div>';
  h+='<div class="inputBox" id="inputBox"></div>'+padHTML();
  $("panel").innerHTML=h;
  say(t.r+" 行 "+t.c+" 列，一共几块砖？");
  bindPad(checkS2,2);
}
function checkS2(v){
  var t=S2.tiles[S2.ti],ans=t.r*t.c;
  if(!t._rec){t._rec=1;statQ(v===ans);}
  if(v===ans){SND.good();S2.ok++;say("对啦！"+t.r+" × "+t.c+" = "+ans);TF=setTimeout(nextS2,850);return;}
  S2.tries++;SND.again();
  var box=$("inputBox");
  if(box){box.textContent="";box.className="inputBox bad";setTimeout(function(){if(box)box.className="inputBox";},340);}
  if(S2.tries>=3){S2.tries=0;say("是 "+ans+" 块，记住啦～");TF=setTimeout(nextS2,1100);return;}
  say(S2.tries>=2?(""+t.r+" 行，每行 "+t.c+" 块。再数数～"):"差一点点，再数数～");
}
function nextS2(){
  S2.ti++;

  renderS2Split();
}
function dots5(n,cls,per){
  /* per = 每行几个（按被乘数成行，孩子一眼能看出「每行 7 块、共几行」） */
  var h='<div class="miniGrid '+cls+'" style="grid-template-columns:repeat('+per+',1fr)">';

}
function renderS2Split(){
  var sp=S2.splits[S2.si];
  S2.phase="split";S2.tries=0;S2.spi=0;

    {ask:"左边一块 "+sp.r+" × "+sp.a+" = ?",ans:sp.r*sp.a},
    {ask:"右边一块 "+sp.r+" × "+(sp.c-sp.a)+" = ?",ans:sp.r*(sp.c-sp.a)},

  ];

function renderS2SplitQ(){

function checkS2Split(v){

   S3a 盖房子 · 锚点（2 / 5 / 10 的倍数）
   ========================================================= */
var ANCHOR=[
 {m:2, grp:"双", unit:"根", one:"1 双筷子 2 根"},
 {m:2, grp:"双", unit:"只", one:"1 双袜子 2 只"},
 {m:2, grp:"副", unit:"只", one:"1 副手套 2 只"},
 {m:2, grp:"辆", unit:"个", one:"1 辆自行车 2 个轮子"},
 {m:5, grp:"只", unit:"根", one:"1 只手 5 根手指"},
 {m:5, grp:"串", unit:"颗", one:"1 串糖葫芦 5 颗"},
 {m:5, grp:"朵", unit:"片", one:"1 朵小花 5 片花瓣"},
 {m:10,grp:"盒", unit:"支", one:"1 盒铅笔 10 支"},
 {m:10,grp:"捆", unit:"根", one:"1 捆小棒 10 根"},
 {m:10,grp:"串", unit:"颗", one:"1 串珠子 10 颗"}
];
/* 4 种题型轮着来：正着算 / 反过来想 / 带零头 / 整十进位，同一局不重复 */
function genS3aQ(used){
  var a,q=null,tries=0;
  while(tries++<40){
    a=ANCHOR[ri(0,ANCHOR.length-1)];
    var k=ri(0,9),n;
    if(k<=4){                                      /* 正着算 m × n */
      n=ri(2,a.m===10?12:(a.m===2?9:7));
      q={ask:a.one+"，"+n+" "+a.grp+"一共多少"+a.unit+"？",ans:a.m*n,
         hint:""+a.m+" 个 "+a.m+" 个地数，数 "+n+" 次",right:"对！"+a.m+" × "+n+" = "+(a.m*n)};
    } else if(k<=6){                               /* 反过来想：总数 → 几份 */
      n=ri(3,a.m===10?8:6);
      q={ask:"一共 "+a.m*n+" "+a.unit+"，每"+a.grp+"是 "+a.m+" "+a.unit+"，一共有几"+a.grp+"？",ans:n,
         hint:"想 "+a.m+" 的乘法口诀：几乘 "+a.m+" 得 "+(a.m*n),right:"对！"+a.m+" × "+n+" = "+(a.m*n)};
    } else if(k<=8){                               /* 带零头：先乘再加 */
      n=ri(2,a.m===10?5:6);var ex=ri(1,a.m-1);
      q={ask:a.one+"，"+n+" "+a.grp+"有多少"+a.unit+"？再加上另外 "+ex+" "+a.unit+"呢？",ans:a.m*n+ex,
         hint:""+a.m+" × "+n+" = "+(a.m*n)+"，再加 "+ex,right:"对！"+a.m+" × "+n+" + "+ex+" = "+(a.m*n+ex)};
    } else {                                       /* 整十进位：10 的大数 */
      n=ri(11,19);
      q={ask:"1 捆小棒 10 根，"+n+" 捆一共多少根？",ans:10*n,
         hint:"10 个 10 个地数，数 "+n+" 次",right:"对！10 × "+n+" = "+(10*n)};
    }
    if(!used[q.ask]){used[q.ask]=1;return q;}
  }
  used[q.ask]=1;return q;
}
function playS3a(){
  var used={};
  runQuiz("S3a",{n:10,tip:"🔨 2、5、10 最好算，正着倒着都要会",
    gen:function(){return genS3aQ(used);},
    doneTitle:"锚点打好了！",

/* =========================================================
   占地棋盘引擎（S3.8 / S4a / S4b 共用；S4b 可选人机或人人）
   cfg: {size, diceN, diceMax, mult(固定乘数), autoPick, useAll, bonus, ai:'none'|'ai'|'p2', win}
   ========================================================= */
var BD=null;
function countOf(ow){var n=0;for(var i=0;i<BD.cells.length;i++){if(BD.cells[i].owner===ow)n++;}return n;}
function isMyTurn(){if(BD.cfg.ai==="p2")return true;return BD.turn===1;}
function neighborsOwner(i,ow){
  var S=BD.cfg.size,r=Math.floor(i/S),c=i%S,n=0;
  var d=[[-1,0],[1,0],[0,-1],[0,1]];
  for(var k=0;k<d.length;k++){
    var rr=r+d[k][0],cc=c+d[k][1];
    if(rr>=0&&rr<S&&cc>=0&&cc<S&&BD.cells[rr*S+cc].owner===ow)n++;
  }
  return n;}
function hasFree(prod){
  for(var i=0;i<BD.cells.length;i++){if(BD.cells[i].owner===0&&BD.cells[i].v===prod)return true;}
  return false;}
/* ---------- 计分：连成一片，一片有几块就得几分 ----------
   不是「谁先占满 N 格」，而是比总分 —— 这样后手也赢得回来：
   手数两边一样多，会连片的人分数更高。                            */
function groupSizeAt(i,ow){          /* 从 i 出发，数出「同一片自己地」有几块 */
  var S=BD.cfg.size,seen={},st=[i],n=0;
  while(st.length){
    var k=st.pop();if(seen[k])continue;seen[k]=1;
    if(BD.cells[k].owner!==ow)continue;
    n++;
    var r=Math.floor(k/S),c=k%S;
    if(r>0)st.push(k-S); if(r<S-1)st.push(k+S);
    if(c>0)st.push(k-1); if(c<S-1)st.push(k+1);
  }
  return n;}
function scoreIfClaim(i,ow){         /* 占下这一格能得几分（= 连成的那一片有几块） */
  var save=BD.cells[i].owner;BD.cells[i].owner=ow;
  var g=groupSizeAt(i,ow);BD.cells[i].owner=save;return g;}
function biggestGroup(ow){           /* 某人最大的一片（结算时点评用） */
  var S=BD.cfg.size,seen={},best=0;
  for(var i=0;i<BD.cells.length;i++){
    if(BD.cells[i].owner!==ow||seen[i])continue;
    var st=[i],g=0;
    while(st.length){
      var k=st.pop();if(seen[k])continue;seen[k]=1;
      if(BD.cells[k].owner!==ow)continue;
      g++;
      var r=Math.floor(k/S),c=k%S;
      if(r>0)st.push(k-S); if(r<S-1)st.push(k+S);
      if(c>0)st.push(k-1); if(c<S-1)st.push(k+1);
    }
    if(g>best)best=g;
  }
  return best;}
/* 这个数字按当前骰子规则掷得出来吗？掷不出来的格子是「海」，画成蓝色、不能占 */
function valueReachable(v){
  var cfg=BD.cfg,mx=cfg.diceMax||9,n=cfg.diceN||1,mul=cfg.mult||1,t=(mul>1)?((v%mul)?0:v/mul):v;
  if(!t)return false;
  if(cfg.autoPick)return t>=1&&t<=mx;
  if(cfg.useAll&&n===2){
    for(var a=1;a<=mx;a++){var b=t/a;if(b===Math.floor(b)&&b>=1&&b<=mx)return true;}
    return false;}
  for(var a2=1;a2<=mx;a2++){var b2=t/a2;if(b2===Math.floor(b2)&&b2>=1&&b2<=mx)return true;}
  return false;}
function curProd(){
  var p=BD.cfg.mult||1;
  for(var i=0;i<BD.picked.length;i++)p*=BD.dice[BD.picked[i]];
  return p;}
function needPick(){return BD.cfg.autoPick?1:(BD.cfg.need||2);}
function pairsOf(cfg){
  if(cfg.autoPick)return [[0]];
  if(cfg.useAll&&cfg.diceN===2)return [[0,1]];
  var o=[];for(var i=0;i<cfg.diceN;i++)for(var j=i+1;j<cfg.diceN;j++)o.push([i,j]);
  return o;}
/* ---------------------------------------------------------
   骰子「不倒空」：不再先随机掷、再看有没有格子，
   而是反过来从「还空着的格子」推出能掷出的骰子组合。
   这样每次掷出的骰子一定在棋盘上有地方可占，不会白等一轮。
   组合数量天然等于真实掷骰概率（12 有 2×6/3×4/4×3/6×2 四种 → 出现概率也正好是 4 倍）
   --------------------------------------------------------- */
function rollCandidates(){
  var cfg=BD.cfg,mx=cfg.diceMax||9,n=cfg.diceN||1,mul=cfg.mult||1,out=[];
  for(var i=0;i<BD.cells.length;i++){
    if(BD.cells[i].owner!==0)continue;
    var v=BD.cells[i].v,t=(mul>1)?((v%mul)?0:v/mul):v;
    if(!t)continue;
    if(cfg.autoPick){                          /* 一颗骰子直接定结果（演习岛：骰子 × 4） */
      if(t>=1&&t<=mx)out.push({i:i,dice:[t]});
      continue;
    }
    if(cfg.useAll&&n===2){                     /* 两颗骰子都必须用：结果要刚好拆成两颗 1..mx */
      for(var a=1;a<=mx;a++){var b=t/a;
        if(b===Math.floor(b)&&b>=1&&b<=mx)out.push({i:i,dice:[a,b]});}
      continue;
    }
    /* n 颗里挑两颗相乘（两张骰子可以同点） */
    for(var a2=1;a2<=mx;a2++){var b2=t/a2;
      if(b2===Math.floor(b2)&&b2>=1&&b2<=mx)out.push({i:i,dice:[a2,b2]});}
  }
  return out;
}
/* 洗牌：别让「能用的那两颗」老是排在最前面，免得孩子摸到规律 */
function shuffleArr(a){
  for(var i=a.length-1;i>0;i--){var j=ri(0,i),t=a[i];a[i]=a[j];a[j]=t;}
  return a;
}
/* 按候选掷出一组骰子（保证有地方可占；棋盘真的没空位时退回纯随机，由上层判结束） */
function rollDiceValues(){
  var cfg=BD.cfg,mx=cfg.diceMax||9,n=cfg.diceN||1,cand=rollCandidates(),d=[],k=0;
  if(cand.length){
    var pick=cand[ri(0,cand.length-1)];
    for(var i=0;i<n;i++)d.push((pick.dice[k]!==undefined)?pick.dice[k++]:ri(1,mx));
    return shuffleArr(d);
  }
  for(var j=0;j<n;j++)d.push(ri(1,mx));
  return shuffleArr(d);
}
/* 收尾：手数用完 / 棋盘上没有可占的格子了 → 比总分（不再是「谁先占满 N 格」） */
function boardResult(){
  var cfg=BD.cfg,s1=BD.pts[0]||0,s2=BD.pts[1]||0;
  var c1=countOf(1),c2=countOf(2),g1=biggestGroup(1),g2=biggestGroup(2);
  if(cfg.ai==="none"){
    var t3=cfg.score3||12;
    endBoard(s1>=t3?3:2,"🏝️ 演习岛打完啦！",
      "你占了 "+c1+" 格 · 连片算分，一共 "+s1+" 分"+(s1>=t3
        ? "（最大的一片连了 "+g1+" 块 —— 把地连成一片，分才高！）"
        : "（下一次试着把地连成一片：一片里有几块就得几分，比东占一格西占一格划算多了）"));
    return;
  }
  if(cfg.ai==="p2"){
    endBoard(3,"🎉 这局打完啦！","🚩 玩家1 "+s1+" 分 · 🧑 玩家2 "+s2+" 分 —— "+
      (s1>s2?"玩家1 更厉害！":(s2>s1?"玩家2 更厉害！":"两个人都一样棒！")));
    return;
  }
  var d=DIFFS[cfg.diff]||DIFFS.mid;
  if(s1>s2){
    endBoard(3,"🏆 你赢了！","你 "+s1+" 分 · 机器人 "+s2+" 分 —— "+(g1>=g2
      ? "你最大的一片连了 "+g1+" 块（机器人 "+g2+" 块），连成一片分数才高！"
      : "你会挑地方：机器人最大的一片 "+g2+" 块，可总分还是你高！")+diffTip(d,"win"));
  } else if(s1===s2){
    endBoard(3,"🤝 打平啦！","你 "+s1+" 分 · 机器人也是 "+s2+" 分 —— 再来一局就能赢它！"+diffTip(d,"draw"));
  } else {
    endBoard(2,"🤖 机器人这次分高一点","你 "+s1+" 分 · 机器人 "+s2+" 分，只差 "+(s2-s1)+
      " 分。下一局盯着「连成一片」去占 —— 一片里有几块就得几分，分数涨得快！"+diffTip(d,"lose"));
  }
}
/* 按难度给下一句建议：赢了往上升，输了往下调 */
function diffTip(d,res){
  if(res==="win"){
    if(d.k==="easy")return "（"+d.ic+" 简单难度赢啦！下次点开这关可以换成「🌤️ 普通」，更有意思～）";
    if(d.k==="mid") return "（"+d.ic+" 普通难度打赢了！要不要挑战「🔥 困难」？）";
    return "（"+d.ic+" 困难难度都赢了，你是真正的小岛高手！🏅）";
  }
  if(res==="draw"){
    if(d.k==="easy")return "（"+d.ic+" 简单难度平手，再练练就赢啦）";
    if(d.k==="mid") return "（"+d.ic+" 普通难度打平，只差一点点！）";
    return "（"+d.ic+" 困难难度打平，已经很厉害了！）";
  }
  if(d.k==="hard")return "（现在是 "+d.ic+" 困难，换成「🌤️ 普通」也能过关，别灰心～）";
  if(d.k==="mid") return "（现在是 "+d.ic+" 普通，想先找找手感就换「🌱 简单」）";
  return "（"+d.ic+" 简单难度：先多赢几局，把连片的手感练熟～）";
}
/* 棋盘上的可占格子全被占了（剩下的是掷不出来的海） */
function boardFull(){
  for(var i=0;i<BD.cells.length;i++){
    if(BD.cells[i].owner===0&&valueReachable(BD.cells[i].v))return false;}
  return true;}
/* 结束判定：两边手数都用完（单机模式只看玩家手数），或全盘没得占 */
function aiRounds(){return BD.cfg.roundsAI||BD.cfg.rounds;}
function aiHandsLeft(){return Math.max(0,aiRounds()-(BD.hand[1]||0));}
function checkBoardEnd(){
  var cfg=BD.cfg;
  var handsDone=(cfg.ai==="none")?(BD.hand[0]>=cfg.rounds)
                                 :(BD.hand[0]>=cfg.rounds&&BD.hand[1]>=aiRounds());
  if(handsDone||boardFull()||!rollCandidates().length){
    BD.over=true;boardResult();return true;}
  return false;
}
/* ---------- 机器人难度三档（只对「和机器人对战」的棋盘生效：S4a / S4b）----------
   skill  = 它认真算（挑连片 / 断你的连片）的概率，其余回合随手占一个
   block  = 贴着你的地占、断你连片的权重
   aiRounds = 机器人这一局能走几手（简单档让它少走两手，孩子赢得更有信心） */
var DIFFS={
  easy:{k:"easy",n:"简单",ic:"🌱",skill:0.00,block:0,aiRounds:6,
        note:"机器人随手占、只走 6 手（你有 8 手）—— 先熟悉规则",star:"几乎稳赢"},
  mid: {k:"mid", n:"普通",ic:"🌤️",skill:0.35,block:1,aiRounds:8,
        note:"机器人会连片、偶尔堵你，双方都是 8 手 —— 势均力敌",star:"要认真连片才赢得到"},
  hard:{k:"hard",n:"困难",ic:"🔥",skill:1.00,block:2,aiRounds:8,
        note:"机器人每手都算得最精：连片 + 堵你，8 手不让你",star:"高手挑战"}
};
var DIFF_ORDER=["easy","mid","hard"];
function diffKey(id){return (P.diff&&P.diff[id])||"mid";}
function diffOf(id){return DIFFS[diffKey(id)]||DIFFS.mid;}
function diffHTML(id){var d=diffOf(id);return '<span class="diffChip '+d.k+'">'+d.ic+" "+d.n+"</span>";}
/* ---------- 对战模式：人机 / 人人（S4b 岛屿争夺战两种玩法合并成一关）----------
   两种模式用的是同一套棋盘、同一套计分规则，区别只是「对手是机器人还是身边的大人」，
   所以合并成一关，进关卡时自己选和谁打。                                        */
var MODES={
  ai:{k:"ai",n:"人机对战",ic:"🤖",note:"和机器人各 8 手比总分 —— 下面还能选它的难度 🌱🌤️🔥"},
  p2:{k:"p2",n:"人人对战",ic:"👨‍👦",note:"和爸爸妈妈同屏轮流：🚩 玩家1 先，🧑 玩家2 后，各 8 手比总分"}
};
var MODE_ORDER=["ai","p2"];
function modeKey(id){return (P.mode&&P.mode[id])||"ai";}
function modeOf(id){return MODES[modeKey(id)]||MODES.ai;}
/* 哪些关卡能在「人机 / 人人」之间切换 */
function hasMode(id){return id==="S4b";}
/* 只有和机器人打的关卡才显示难度（人人对战时没有难度可选） */
function hasDiff(id){
  if(id==="S4a")return true;
  if(id==="S4b")return modeKey(id)==="ai";
  return false;
}
/* 地图上的小徽章：人人对战显示「👨‍👦 人人」，人机对战显示难度 */
function modeChipHTML(id){var m=modeOf(id);return '<span class="diffChip '+m.k+'">'+m.ic+" "+m.n+"</span>";}
function chipHTML(id){return (hasMode(id)&&modeKey(id)==="p2")?modeChipHTML(id):diffHTML(id);}
/* 切换对战模式：换掉这一局的配置（棋盘尺寸一样，安全替换） */
function pickMode(k){
  if(!BD||!BD.cfg)return;
  if(!MODES[k])return;
  if(!P.mode)P.mode={};
  P.mode[BD.id]=k;saveProg();SND.tap();
  if(BD.id==="S4b")BD.cfg=s4bCfg(k);
  applyDiff();drawRules();
}
function pickDiff(k){
  if(!BD||!BD.cfg||BD.cfg.ai!=="ai")return;
  if(!DIFFS[k])return;
  if(!P.diff)P.diff={};
  P.diff[BD.id]=k;saveProg();SND.tap();
  applyDiff();drawRules();
}
/* 把难度参数写进这一局的配置 */
function applyDiff(){
  var cfg=BD.cfg;
  if(cfg.ai!=="ai")return;
  var d=diffOf(BD.id);
  cfg.aiSkill=d.skill;cfg.block=d.block;cfg.roundsAI=d.aiRounds;cfg.diff=d.k;
}
function startBoard(id,cfg){
  stopTimer();
  var cells=[];
  for(var r=1;r<=cfg.size;r++)for(var c=1;c<=cfg.size;c++)cells.push({v:r*c,owner:0});
  BD={id:id,cfg:cfg,cells:cells,dice:[],picked:[],turn:1,over:false,rolling:false,
      pts:[0,0],hand:[0,0],miss:0,aiReroll:0};
  statStart(id);
  applyDiff();                          /* 和机器人打时才生效：套用上次的难度 */
  if(cfg.rules){drawRules();return;}   /* 先给孩子讲清楚怎么玩，再开局 */
  boardBegin();
}
/* 开局：谁先手由 cfg.first 决定（'ai' = 机器人先占一格，孩子来追） */
function boardBegin(){
  var cfg=BD.cfg;
  $("panel").className="panel";       /* 收起规则卡时恢复面板的居中布局 */
  say(cfg.tip||"开始占地啦！");
  if(cfg.ai==="ai"&&cfg.first==="ai"){
    BD.turn=2;drawBoard();
    TF=setTimeout(aiTurn,900);
    return;
  }
  drawBoard();
}
/* 开局规则卡：一屏看懂「掷骰子 → 自己算 → 点格子」 */
function drawRules(){
  var cfg=BD.cfg,h="";
  h+='<div class="qsub">'+(cfg.name||"占地小游戏")+"</div>";
  h+='<div class="rulesCard" id="rulesCard"><div class="rTitle">🎲 怎么玩？</div>';
  for(var i=0;i<cfg.rules.length;i++)h+='<div class="rItem">'+cfg.rules[i]+"</div>";
  h+="</div>";
  if(hasMode(BD.id)){
    var mk2=modeKey(BD.id);
    h+='<div class="modePick"><div class="dpT">👥 今天和谁打？（下次进来会记住）</div><div class="dpRow">';
    for(var w=0;w<MODE_ORDER.length;w++){
      var m2=MODES[MODE_ORDER[w]];
      h+='<div class="dpBtn mpBtn '+m2.k+(mk2===m2.k?" on":"")+'" onclick="pickMode(\''+m2.k+'\')">'+
           '<div class="dpIc">'+m2.ic+'</div><div class="dpN">'+m2.n+"</div></div>";
    }
    h+="</div>";
    h+='<div class="dpNote">'+(MODES[mk2]||MODES.ai).n+"："+(MODES[mk2]||MODES.ai).note+"</div></div>";
  }
  if(cfg.ai==="ai"){
    var dk=diffKey(BD.id);
    h+='<div class="diffPick"><div class="dpT">🤖 选一个机器人难度（下次进来会记住）</div><div class="dpRow">';
    for(var q=0;q<DIFF_ORDER.length;q++){
      var d2=DIFFS[DIFF_ORDER[q]];
      h+='<div class="dpBtn '+d2.k+(dk===d2.k?" on":"")+'" onclick="pickDiff(\''+d2.k+'\')">'+
           '<div class="dpIc">'+d2.ic+'</div><div class="dpN">'+d2.n+"</div></div>";
    }
    h+="</div>";
    var cur=DIFFS[dk]||DIFFS.mid;
    h+='<div class="dpNote">'+cur.n+"："+cur.note+"</div></div>";
  }
  h+='<div style="margin-top:14px;padding-bottom:4px"><button class="bigBtn" id="ruleGo">我明白啦，开始！</button></div>';
  $("panel").innerHTML=h;
  $("panel").className="panel rulesOpen";      /* 卡片多时整块面板滚动，不截断文案 */
  say("先看看怎么玩，再开始～");
  var go=$("ruleGo");
  if(go)go.addEventListener("click",function(){SND.tap();$("panel").innerHTML="";boardBegin();});
}
/* 顶部常驻提示：现在该做什么（不直接给答案，让孩子自己算） */
function diceExpr(){
  var parts=[];
  for(var i=0;i<BD.picked.length;i++)parts.push(BD.dice[BD.picked[i]]);
  if(BD.cfg.mult&&BD.cfg.mult!==1)parts.push(BD.cfg.mult);
  return parts.join(" × ");
}
function boardGoal(){
  var cfg=BD.cfg;
  if(cfg.ai==="ai"&&BD.turn!==1&&!BD.over)return {t:"🤖 机器人回合，看看它怎么占…",w:true};
  if(!BD.dice.length)return {t:"🎲 点「掷骰子」"+((BD.cfg.diceN>1)?("，一次掷 "+BD.cfg.diceN+" 颗"):"，看看骰子掷出几"),w:true};
  if(BD.picked.length<needPick()){
    return {t:"👆 再选 "+(needPick()-BD.picked.length)+" 颗骰子",w:true};
  }
  return {t:"🎲 骰子是 "+diceExpr()+" → 自己在心里算出结果，再点棋盘上这个数字的格子",w:false};
}
/* 中间那格：还剩几手（两边手数一样多，所以后手也追得回来） */
function turnBoxHTML(){
  var cfg=BD.cfg,who=(cfg.ai==="p2")?(BD.turn===2?1:0):0;
  var left=Math.max(0,cfg.rounds-(BD.hand[who]||0));
  var sub=(cfg.ai==="p2")?(BD.turn===1?"轮到玩家1 🚩":"轮到玩家2 🧑"):("你还能占 "+left+" 格");

  return '<div class="scoreBox mid"><div class="scoreLbl">'+lbl+"</div>"+
    '<div class="scoreNum turnc">'+left+'</div><div class="scoreSub">'+sub+"</div></div>";
}
function scoreBoxHTML(lbl,cls,sc,cnt,sub){

    '</div><div class="scoreSub">'+(sub||("占了 "+cnt+" 格"))+"</div></div>";
}
function scoreRowHTML(){
  var cfg=BD.cfg,s1=BD.pts[0]||0,s2=BD.pts[1]||0,h='<div class="scoreRow">';
  if(cfg.ai==="none"){
    h+=scoreBoxHTML("🚩 你的分","s1c",s1,countOf(1))+turnBoxHTML();
  }else if(cfg.ai==="p2"){

    h+=scoreBoxHTML("🚩 你的分","s1c",s1,countOf(1))+turnBoxHTML()+

         "占了 "+countOf(2)+" 格 · 还剩 "+aiHandsLeft()+" 手");

}
function drawBoard(){
  var cfg=BD.cfg,h="";
  h+=scoreRowHTML();
  h+='<div class="diceArea" id="diceArea">';

    h+='<div class="die'+(BD.picked.indexOf(d)>=0?" selected":"")+(BD.rolling?" rolling":"")+'" data-d="'+d+'">'+(BD.rolling?"🎲":BD.dice[d])+"</div>";
  }

     '<button class="ghostBtn" id="rollBtn">🎲 掷骰子</button>'+
     '<button class="ghostBtn" onclick="backToMap()">← 回地图</button></div>';

    /* 注意：这里不再高亮答案格 —— 乘积要孩子自己算、自己找 */
    if(cl.owner&&neighborsOwner(i,cl.owner))cls+=" bonus";
    var fg=cl.owner?(cl.owner===1?"🚩":(cfg.ai==="p2"?"🧑":"🤖")):"";

function bindBoard(){
  var da=$("diceArea");
  if(da)da.addEventListener("click",function(ev){
    var k=ev.target.getAttribute("data-d");if(k===null||k===undefined)return;
    pickDie(parseInt(k,10));});
  var b=$("board");
  if(b)b.addEventListener("click",function(ev){
    var k=ev.target.getAttribute("data-i");if(k===null||k===undefined)return;
    claim(parseInt(k,10));});
  var rb=$("rollBtn");if(rb)rb.addEventListener("click",rollDice);
}
function rollDice(){
  if(BD.over||BD.rolling)return;
  if(BD.cfg.ai==="ai"&&BD.turn!==1)return;
  if(!rollCandidates().length){BD.over=true;boardResult();return;}   /* 全盘没得占了 */
  BD.picked=[];BD.miss=0;BD.rolling=true;BD.lastGain=null;drawBoard();
  say("🎲 骰子转起来啦…");SND.tap();
  TF=setTimeout(function(){
    BD.dice=rollDiceValues();                   /* 保证这一掷棋盘上有地方可占 */
    BD.rolling=false;
    if(BD.cfg.autoPick)BD.picked=[0];
    else if(BD.cfg.diceN===2&&BD.cfg.useAll)BD.picked=[0,1];
    drawBoard();
    /* 只说骰子是几，乘积让孩子自己算 */
    if(BD.picked.length>=needPick())say("🎲 骰子是 "+diceExpr()+"，自己算一算结果是多少～");
    else say("🎲 骰子是 "+BD.dice.join(" 和 ")+"，选两颗相乘～");
  },600);
}
function pickDie(d){
  if(BD.over||BD.rolling||!BD.dice.length)return;
  if(BD.cfg.autoPick||(BD.cfg.diceN===2&&BD.cfg.useAll))return;
  if(BD.cfg.ai==="ai"&&BD.turn!==1)return;
  var idx=BD.picked.indexOf(d);
  if(idx>=0)BD.picked.splice(idx,1);
  else if(BD.picked.length<2)BD.picked.push(d);
  BD.miss=0;BD.lastGain=null;drawBoard();
  if(BD.picked.length>=needPick())say("🎲 骰子是 "+diceExpr()+"，自己算一算结果是多少～");
}
function claim(i){
  if(BD.over)return;
  if(BD.picked.length<needPick()){say("先掷骰子，再点格子～");return;}
  var prod=curProd(),cl=BD.cells[i];
  /* 这一对骰子算出的数在棋盘上没有空格：不算失误，换一对（别让运气决定胜负） */
  if(!hasFree(prod)&&cl.v!==prod){
    BD.miss=0;
    if(BD.dice.length>2||(!BD.cfg.useAll&&BD.dice.length>=2)){
      BD.picked=[];drawBoard();                       /* 骰子还留着，换另外两颗试试 */
      say("这一对骰子的结果，棋盘上没有空格啦 —— 换两颗骰子再选一次～");
    }else{
      BD.picked=[];BD.dice=[];drawBoard();
      say("这一对骰子在棋盘上已经没有空格啦，再掷一次换一对～");
    }
    return;
  }
  if(cl.owner!==0||cl.v!==prod){
    /* 算错/点错：不红叉、不判负，给一次修正机会；第二次这一轮就让给对方 */
    statQ(false);
    BD.miss=(BD.miss||0)+1;
    SND.hint();
    if(BD.miss>=2){
      BD.miss=0;
      /* 这一手作废（算用掉一次机会，两边规则一样，公平） */
      if(BD.cfg.ai==="ai"){
        BD.hand[0]++;BD.turn=2;BD.picked=[];drawBoard();
        if(checkBoardEnd())return;
        say("这一手没算出来，让机器人试试～ 下一轮一定行！");
        TF=setTimeout(aiTurn,750);return;
      }
      if(BD.cfg.ai==="p2"){
        BD.hand[BD.turn-1]++;
        BD.turn=BD.turn===1?2:1;BD.picked=[];BD.dice=[];drawBoard();
        if(checkBoardEnd())return;
        say("这一手让给 "+(BD.turn===1?"玩家1 🚩":"玩家2 🧑")+"，接着来！");return;
      }
      BD.picked=[];BD.dice=[];drawBoard();
      say("没找到也没关系，重新掷一次骰子吧～");return;
    }
    say("这个格子的数字不对哦，再算一算 "+diceExpr()+" 是多少～");
    return;
  }
  statQ(true);
  var who=(BD.cfg.ai==="p2")?BD.turn:1;
  cl.owner=who;
  /* 得分 = 把地连成一片后，这一片有几块（孤零零一格就是 1 分） */
  var g=groupSizeAt(i,who);
  BD.pts[who-1]+=g;BD.hand[who-1]++;
  BD.lastGain={who:who,g:g,i:i};
  var gainTxt=(g>1?("🎉 连成 "+g+" 块的一片，+"+g+" 分！"):((who===1?"🚩 占 ":"🧑 占 ")+cl.v+" · +1 分"));
  SND.good();drawBoard();
  say(gainTxt);
  if(checkBoardEnd())return;
  if(BD.cfg.ai==="p2"){
    BD.turn=BD.turn===1?2:1;BD.picked=[];BD.dice=[];BD.miss=0;drawBoard();
    say("轮到 "+(BD.turn===1?"玩家1 🚩":"玩家2 🧑")+" 掷骰子");return;}
  if(BD.cfg.ai==="ai"){
    BD.turn=2;BD.picked=[];BD.miss=0;drawBoard();
    TF=setTimeout(aiTurn,750);return;}
  BD.picked=[];BD.dice=[];BD.miss=0;drawBoard();
  say(gainTxt+" 点「掷骰子」再来一格～");
}
/* 机器人：和玩家掷同一副骰子（不偷换），也只占「骰子算得出来」的格子。
   aiSkill = 它认真算的概率，其余回合会随手乱占 —— 孩子才赢得到。 */
function aiTurn(){
  if(BD.over)return;
  /* 简单档：机器人手数更少，它走完后就一直是你占（别让它偷偷多走） */
  if(aiHandsLeft()<=0){
    BD.turn=1;BD.picked=[];BD.dice=[];BD.miss=0;drawBoard();
    say("🤖 机器人的 "+(BD.cfg.roundsAI||BD.cfg.rounds)+" 手走完啦，剩下的都是你的 —— 继续！");
    return;
  }
  say("🤖 机器人算一算…");
  TF=setTimeout(function(){
    var cfg=BD.cfg,mx=cfg.diceMax||9,n=cfg.diceN||1;
    var tab=rollCandidates();
    if(!tab.length){BD.over=true;boardResult();return;}
    var roll=tab[ri(0,tab.length-1)];
    BD.dice=[];
    for(var di=0;di<n;di++)BD.dice.push((roll.dice[di]!==undefined)?roll.dice[di]:ri(1,mx));
    shuffleArr(BD.dice);
    /* 这副骰子能算出的结果 → 对应的空格（和玩家看到的是同一套规则） */
    var opts=[],seen={},prs=pairsOf(cfg);
    for(var p=0;p<prs.length;p++){
      var pr=cfg.mult||1;
      for(var q=0;q<prs[p].length;q++)pr*=BD.dice[prs[p][q]];
      for(var k=0;k<BD.cells.length;k++){
        if(BD.cells[k].owner!==0||BD.cells[k].v!==pr||seen[k])continue;
        seen[k]=1;opts.push({i:k,combo:prs[p]});
      }
    }
    if(!opts.length){BD.over=true;boardResult();return;}
    var best=opts[0],bsc=-1;
    var bw=(cfg.block===undefined)?1:cfg.block;
    for(var o2=0;o2<opts.length;o2++){
      var sc=scoreIfClaim(opts[o2].i,2)*2+neighborsOwner(opts[o2].i,1)*bw;
      if(sc>bsc){bsc=sc;best=opts[o2];}
    }
    var skill=(cfg.aiSkill===undefined)?1:cfg.aiSkill;
    var pick=(Math.random()<skill)?best:opts[ri(0,opts.length-1)];
    BD.picked=pick.combo.slice();
    BD.cells[pick.i].owner=2;
    var g=groupSizeAt(pick.i,2);
    BD.pts[1]+=g;BD.hand[1]++;
    BD.lastAI={dice:BD.dice.slice(),picked:pick.combo.slice(),i:pick.i,g:g};   /* 记下它这一手，便于核对 */
    BD.lastGain={who:2,g:g,i:pick.i};
    say(g>1?("🤖 机器人把地连成了 "+g+" 块，拿了 "+g+" 分"):"🤖 机器人占了一格");
    drawBoard();
    if(checkBoardEnd())return;
    BD.turn=1;BD.picked=[];BD.dice=[];BD.miss=0;drawBoard();
    say("轮到你啦！点「掷骰子」");
  },700);
}

  return {cls:"tgBad",tx:"🔧 待加强"};
}

/* =========================================================
   乘法口诀表：9×9 小九九 + 19×19 大九九（去掉 9×9 那块）
   随时可查 · 遮住自测 · 朗读 · 抽查背诵（会记进度）
   入口：右上角 📖 / 地图「📖 乘法口诀表」
   ========================================================= */
var CN_N=["零","一","二","三","四","五","六","七","八","九","十","十一","十二","十三","十四","十五","十六","十七","十八","十九"];
function cnNum(n){
  n=Math.floor(n);
  if(n<10)return CN_N[n]||(""+n);
  if(n===10)return "十";
  if(n<20)return "十"+CN_N[n-10];
  if(n<100){var t=Math.floor(n/10),o=n%10;return CN_N[t]+"十"+(o?CN_N[o]:"");}
  var hn=Math.floor(n/100),rn=n%100;
  if(hn<10)return CN_N[hn]+"百"+(rn?(rn<10?"零"+CN_N[rn]:cnNum(rn)):"");
  return ""+n;
}
function ck(a,b){var x=Math.min(a,b),y=Math.max(a,b);return x+"x"+y;}
/* 小九九句式：得数小于 10 加「得」—— 二三得六 / 三四十二 */
function chantSent(a,b){var x=Math.min(a,b),y=Math.max(a,b),p=x*y;
  /* 小九九习惯读法：二五一十（10 读「一十」），其他十几读「十几」 */
  var pr=(p===10)?"一十":cnNum(p);
  return cnNum(x)+cnNum(y)+(p<10?("得"+cnNum(p)):pr);}
function chantSentMask(a,b){var x=Math.min(a,b),y=Math.max(a,b);return cnNum(x)+cnNum(y)+"（ ？ ）";}
function speakTxt(t){
  if(!CH.speak||!t)return;
  try{if(!window.speechSynthesis)return;window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(t);u.lang="zh-CN";u.rate=0.85;window.speechSynthesis.speak(u);}catch(e){}
}
var CH={tab:"s9",view:{s9:"grid",big:"list"},mask:false,speak:false,hideSub:true,rev:{},hl:null,
        qr:"s9",mode:"rand",q:null,showAns:false,seq:null,si:0,ok:0,bad:0};
function chV(){return CH.view[CH.tab==="big"?"big":"s9"];}

var CRANGE={
  s9  :{nm:"小九九 1-9",f:function(a,b){return a<=9&&b<=9;}},
  hard:{nm:"小九九难点",f:function(a,b){return a<=9&&b<=9&&Math.min(a,b)>=6;}},
  big :{nm:"大九九新增",f:function(a,b){return a>=10||b>=10;}},
  all :{nm:"全部 19×19",f:function(a,b){return true;}}
};
function rangeList(r){
  var out=[],f=(CRANGE[r]&&CRANGE[r].f)||function(){return true;};
  for(var a=1;a<=19;a++)for(var b=a;b<=19;b++){if(f(a,b))out.push([a,b]);}
  return out;
}
function wrongList(){
  var out=[];
  for(var k in P.chant){var v=P.chant[k]||{};
    if((v.bad||0)>(v.ok||0)){var p=k.split("x");if(p.length===2)out.push([parseInt(p[0],10),parseInt(p[1],10)]);}}
  return out;
}
function mastered(r){
  var L=(r==="wrong")?wrongList():rangeList(r),n=0;
  for(var i=0;i<L.length;i++){var v=P.chant[ck(L[i][0],L[i][1])]||{};
    if((v.ok||0)>=2&&(v.ok||0)>(v.bad||0))n++;}
  return {n:n,tot:L.length};
}
/* 什么时候该背？按孩子的进度给建议 */
function chantAdvice(){
  if(!stageDone("S1"))
    return "<b>现在先别背。</b>先把「几个几」弄明白：多玩分草莓、铺地砖，看到 3×4 能想到「3 排、每排 4 个」。先理解，再背诵，才不会背成顺口溜。";
  if(!stageDone("S3a"))
    return "<b>可以开始背头几行。</b>先背 <b>2、5、10</b> 三行：两个两个数、五个五个数、十个十个数，生活里随时能数，背着不费劲。";
  if(!stageDone("S3b"))
    return "<b>正式背小九九的时候到了。</b>顺序：2、5 → 9（手指口诀）→ 3、4 → 6、7、8。每天 5 分钟，先顺着背，再抽着背。";
  if(!stageDone("S3c"))
    return "<b>背熟 + 提速。</b>45 句练到「不假思索」：每天抽背 10 句 + 一次 60 秒限时赛，只跟昨天的自己比。";
  if(!stageDone("S5b"))
    return "<b>小九九还要会倒着用。</b>看到 56 想到「七八五十六」（这也是除法的基础）。大九九<b>不用背</b>，学会拆：14×3 = 10×3 + 4×3。";
  return "<b>大九九只练「算得快」，不必背。</b>十几 × 十几拆成四块算；有兴趣再挑战 11~19，当脑力游戏就好。";
}

function chantGridHTML(){
  var big=(CH.tab==="big"),hi=big?19:9,h='<div class="cgrid'+(big?" big":" s9")+'">',a,b;
  /* 全部用显式网格坐标，行列标题吸附；大九九「去掉 9×9」时左上天然空出来（L 形） */
  h+='<div class="ccell hd'+(big?" corner":"")+'"'+(big?' style="grid-area:1/1/2/2"':"")+">×</div>";
  for(b=1;b<=hi;b++)h+='<div class="ccell hd'+(big?" ch":"")+'"'+(big?' style="grid-area:1/'+(b+1)+"/2/"+(b+2)+'"':"")+">"+b+"</div>";
  for(a=1;a<=hi;a++){
    h+='<div class="ccell hd'+(big?" rh":"")+'"'+(big?' style="grid-area:'+(a+1)+'/1/'+(a+2)+'/2"':"")+">"+a+"</div>";
    for(b=1;b<=hi;b++){
      var sub=big&&a<=9&&b<=9;
      if(sub&&CH.hideSub)continue;   /* 去掉 9×9 部分：留白，左上放跳转块 */
      var k=ck(a,b),rev=!!CH.rev[k],masked=CH.mask&&!rev,p=a*b;
      var pos=big?(' style="grid-area:'+(a+1)+"/"+(b+1)+"/"+(a+2)+"/"+(b+2)+'"'):"";
      h+='<div id="cg-'+a+"-"+b+'" class="ccell'+(sub?" sub":"")+(masked?" blank":"")+((CH.mask&&rev)?" rev":"")+
         '"'+pos+' onclick="chCell('+a+","+b+')">'+(masked?"？":p)+"</div>";
    }
  }
  if(big&&CH.hideSub)
    h+='<div class="ccell s9box" style="grid-area:2/2/11/11" onclick="chTab(\'s9\')">'+
       "<b>小九九 1~9</b><br>已经会啦<br><u>点这里去背</u></div>";
  return h+"</div>";
}
function chCell(a,b){
  var k=ck(a,b);
  if(CH.mask&&!CH.rev[k]){CH.rev[k]=1;var el=$("cg-"+a+"-"+b);if(el){el.textContent=a*b;el.className="ccell rev";}}
  hlRC(a,b);
  speakTxt(CH.tab==="big"?(a+"乘"+b+"等于"+(a*b)):chantSent(a,b));
  SND.tap();
}
function hlRC(a,b){
  var hi=CH.tab==="big"?19:9,i,e;
  if(CH.hl){for(i=1;i<=19;i++){
    e=$("cg-"+CH.hl[0]+"-"+i);if(e)e.className=e.className.replace(" hl","");
    e=$("cg-"+i+"-"+CH.hl[1]);if(e)e.className=e.className.replace(" hl","");}}
  for(i=1;i<=hi;i++){
    e=$("cg-"+a+"-"+i);if(e)e.className+=" hl";
    e=$("cg-"+i+"-"+b);if(e)e.className+=" hl";}
  CH.hl=[a,b];
}

function chantListHTML(){
  var big=(CH.tab==="big"),hi=big?19:9,h="",order=[],i0;
  /* 大九九先排「十几 × 1~19」（最常用），再排「几 × 十几」 */
  if(big){for(i0=10;i0<=19;i0++)order.push(i0);for(i0=1;i0<=9;i0++)order.push(i0);}
  else{for(i0=1;i0<=9;i0++)order.push(i0);}
  for(var oi=0;oi<order.length;oi++){
    var a=order[oi],items=[];
    for(var b=1;b<=hi;b++){
      if(CH.tab==="big"){if(a<=9&&b<=9)continue;}
      else if(b<a)continue;
      items.push(b);
    }
    if(!items.length)continue;
    h+='<div class="cgroup"><div class="cgt">'+
       (CH.tab==="big"?(a<=9?(cnNum(a)+" 乘十几（" + a + " × 10~19）"):(a+" 的口诀（"+a+" × 1~19）")):(cnNum(a)+" 的口诀"))+
       '</div><div class="crow">';
    for(var j=0;j<items.length;j++){
      var b2=items[j],k=ck(a,b2),rev=!!CH.rev[k],masked=CH.mask&&!rev,p=a*b2,tx;
      if(CH.tab==="big")tx=a+" × "+b2+" = "+p; else tx=chantSent(a,b2);
      if(masked)tx=(CH.tab==="big")?(a+" × "+b2+" = ？"):chantSentMask(a,b2);
      h+='<div id="cs-'+a+"-"+b2+'" class="csent'+(masked?" blank":((CH.mask&&rev)?" rev":""))+
         '" onclick="chSent('+a+","+b2+')">'+tx+"</div>";
    }
    h+="</div></div>";
  }
  return h;
}
function chSent(a,b){
  var k=ck(a,b);
  if(CH.mask&&!CH.rev[k]){
    CH.rev[k]=1;var el=$("cs-"+a+"-"+b);
    if(el){el.className="csent rev";el.textContent=(CH.tab==="big")?(a+" × "+b+" = "+(a*b)):chantSent(a,b);}
  }
  speakTxt(CH.tab==="big"?(a+"乘"+b+"等于"+(a*b)):chantSent(a,b));
  SND.tap();
}

function chRange(r){CH.qr=r;CH.q=null;CH.showAns=false;CH.seq=null;CH.si=0;SND.tap();renderChant();}
function chMode(m){CH.mode=m;CH.q=null;CH.showAns=false;CH.seq=null;CH.si=0;SND.tap();renderChant();}
function qzList(){return CH.qr==="wrong"?wrongList():rangeList(CH.qr);}
function qzShow(){CH.showAns=!CH.showAns;SND.tap();renderChant();}
function qzSpeak(){
  if(!CH.q)return;
  var a=CH.q[0],b=CH.q[1];
  speakTxt((a>=10||b>=10)?(a+"乘"+b):(cnNum(a)+cnNum(b)));
}
function qzNext(){
  var L=qzList();
  if(!L.length){CH.q=null;renderChant();return;}
  CH.q=pick(L);CH.showAns=false;SND.tap();qzSpeak();renderChant();
}
function qzStep(d){
  if(!CH.seq){CH.seq=qzList();CH.si=0;if(!CH.seq.length){CH.q=null;renderChant();return;}}
  CH.si=(CH.si+d+CH.seq.length)%CH.seq.length;
  CH.q=CH.seq[CH.si];CH.showAns=false;SND.step();qzSpeak();renderChant();
}
function qzMark(ok){
  if(!CH.q)return;
  var k=ck(CH.q[0],CH.q[1]),v=P.chant[k]||{ok:0,bad:0};
  if(ok){v.ok=(v.ok||0)+1;CH.ok++;CH.showAns=true;SND.good();}
  else{v.bad=(v.bad||0)+1;CH.bad++;CH.showAns=true;SND.again();}
  P.chant[k]=v;saveProg();
  if(CH.mode==="seq")qzStep(1);else renderChant();
}
function quizHTML(){
  var h="",rs=["s9","hard","big","all"],i;
  h+='<div class="chantOpt">';
  for(i=0;i<rs.length;i++)h+='<div class="cbtn'+(CH.qr===rs[i]?" on":"")+'" onclick="chRange(\''+rs[i]+'\')">'+CRANGE[rs[i]].nm+"</div>";
  var wl=wrongList();
  if(wl.length)h+='<div class="cbtn'+(CH.qr==="wrong"?" on":"")+'" onclick="chRange(\'wrong\')">🔁 只练不熟（'+wl.length+"）</div>";
  h+="</div>";
  h+='<div class="chantOpt">'+
     '<div class="cbtn'+(CH.mode==="rand"?" on":"")+'" onclick="chMode(\'rand\')">🎲 乱序抽查</div>'+
     '<div class="cbtn'+(CH.mode==="seq"?" on":"")+'" onclick="chMode(\'seq\')">📜 顺着背</div>'+
     '<div class="cbtn'+(CH.speak?" on":"")+'" onclick="chSpeak()">'+(CH.speak?"🔊 朗读中":"🔇 朗读")+"</div></div>";
  var m=mastered(CH.qr==="wrong"?"all":CH.qr);
  h+='<div style="font-size:12.5px;font-weight:800;color:#5A7A8A;text-align:left">🏅 熟记 '+m.n+" / "+m.tot+" 句"+
     '<div class="mBar"><i style="width:'+(m.tot?Math.round(m.n/m.tot*100):0)+'%"></i></div></div>';
  if(!CH.q){h+='<div class="qzBig">准备好了吗？</div><div class="qzAns" style="font-size:16px;color:#5A7A8A">点下面「开始背」，先大声说答案，再核对</div>';}
  else{
    var a=CH.q[0],b=CH.q[1],p=a*b,big=(a>=10||b>=10);
    h+='<div class="qzBig">'+(big?(a+" × "+b+" = ？"):chantSentMask(a,b))+"</div>";
    h+='<div class="qzAns">'+(CH.showAns?p:"…")+"</div>";
  }
  h+='<div class="qzStat">本次 ✅ '+CH.ok+" · 🔁 "+CH.bad+"</div>";
  h+='<div class="qzBtns">';
  if(!CH.q){h+='<button class="bigBtn" style="padding:12px 30px;font-size:18px" onclick="'+(CH.mode==="seq"?"qzStep(0)":"qzNext()")+'">开始背</button>';}
  else{
    h+='<button class="ghostBtn" onclick="qzShow()">'+(CH.showAns?"收起答案":"看答案")+"</button>";
    if(CH.mode==="seq"){
      h+='<button class="ghostBtn" onclick="qzStep(-1)">← 上一句</button>';
      h+='<button class="ghostBtn" onclick="qzStep(1)">下一句 →</button>';
    }else h+='<button class="ghostBtn" onclick="qzNext()">换一句</button>';
    h+='<button class="ghostBtn" style="background:#E4F7EC;color:#1D7A50" onclick="qzMark(1)">✅ 背对了</button>';
    h+='<button class="ghostBtn" style="background:#FFF3D6;color:#9A6A00" onclick="qzMark(0)">🔁 还要练</button>';
  }
  h+="</div>";
  h+='<div class="chantTip" style="margin-top:10px">🙋 让孩子<b>先大声说出答案</b>，再点「看答案」核对。背对点 ✅、卡住点 🔁 —— 不熟的句子会记下来，下次可以只练它们。</div>';
  return h;
}

  var on=SND.toggle();$("soundBtn").textContent=on?"🔊":"🔇";if(on)SND.tap();});

(function boot(){
  loadProg();
  if(!IS_GUEST){pullIsland();
    $("titleTip").textContent="欢迎回来，" + USER + " · 小岛进度会自动保存";}
  else{$("titleTip").textContent="提示：从主页登录后上岛，换设备也能接着玩";}
})();
